# AIcheck 网关配置。
#
# 2026-08-14 之前这份文件只存在于服务器 /home/dev-bjy/aicheck-web/conf/，
# 不在版本管理内——和 build_runtime_env.py 一样，部署行为的一部分没有 diff、
# 没法回滚。现在由部署脚本从仓库同步过去。

server {
  listen 80;
  # Docker 内嵌 DNS。valid=10s 让容器重建后最多十秒自动切到新 IP；
  # ipv6=off 避免解析出容器网络里用不了的 IPv6 地址。
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 512m;

  location /api/ {
    # 容器名按**变量**解析，配合上面的 resolver 定期重查 DNS。
    #
    # 直接写 proxy_pass http://aicheck-api:8000 时，nginx 只在启动那一刻
    # 解析一次并把 IP 焊死。API 容器一旦重建就换 IP，nginx 还在打旧地址，
    # 全站 502，日志里是 "Host is unreachable"——而后端其实好好的。
    #
    # 2026-08-16 线上真实发生：手工重启 API 后 IP 从 172.21.0.14 变成
    # 172.21.0.13，网关 502 而直连后端 200。部署脚本每次换容器都
    # nginx -s reload 正是为了绕开这一点，但**任何绕开部署流程的重启都会
    # 再次踩中**——所以从配置层根治，而不是靠记得多敲一条命令。
    set $aicheck_api_upstream "aicheck-api:8000";
    proxy_pass http://$aicheck_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ONLYOFFICE Document Server：Office 文件在线预览（只读）。
  # 经本机 nginx 反代而不是直接暴露端口——浏览器与页面同源，省掉跨域配置，
  # 也避免把 DS 的管理面直接挂到公网。
  location /onlyoffice/ {
    proxy_pass http://onlyoffice/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # DS 的协作通道走 WebSocket，缺这两行会一直重连
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 对象存储：浏览器直传/直下的那条路。
  #
  # 上传是「后端给一个预签名 URL，浏览器直接把字节 PUT 过去」。原来签出来的是
  # `http://127.0.0.1:19000/...`——服务器自己的回环地址。浏览器照着连的是它**自己**的
  # 127.0.0.1，必然失败。2026-08-15 实操：建会话 176ms 成功，传字节报
  # `Failed to fetch`，**通过浏览器上传对所有角色 100% 失败**；库里那批
  # 「有记录、无内容哈希」的空壳文件就是这么攒出来的。
  #
  # MinIO 只绑在宿主机 127.0.0.1:19000，对外不通。不新开公网端口，改由页面同源的
  # 这台 nginx 按桶前缀转进去；预签名也按这个 host 计算（见 build_runtime_env.py）。
  #
  # `proxy_set_header Host $http_host` 是关键：S3 签名把 Host 算进去了，
  # 这里一改写签名就对不上，MinIO 会回 SignatureDoesNotMatch。
  # 上面 /api/ 用的是 $host（不含端口），这里必须用 $http_host（含端口）。
  location /documents/ {
    proxy_pass http://aicheck-minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 大文件直传：不缓冲请求体，否则 nginx 会先把整个文件落到临时盘
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # 构建产物：**不走 SPA 回退**。
  #
  # 原先所有路径都落到 `try_files $uri $uri/ /index.html`，包括 /assets/*.js。
  # 前端每次构建 chunk 哈希全变、旧 chunk 被删，而浏览器缓存里的 index.html
  # 仍指向旧名字——于是请求一个已删除的 .js，nginx 回 200 + index.html 的 HTML。
  #
  # 浏览器随后报：
  #   Failed to load module script: Expected a JavaScript-or-Wasm module script
  #   but the server responded with a MIME type of "text/html".
  #
  # 这个报错与真实原因（你手上的页面是上一版）毫不相干，用户只看到「登录时弹错误」。
  # 2026-08-14 用户实际撞到过。
  #
  # 改成对缺失的构建产物直接 404：错误变得可自解释，前端也能据此提示用户刷新。
  location /assets/ {
    try_files $uri =404;
    # 带哈希的文件名天然可长期缓存；index.html 另行处理（见下）。
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html 绝不缓存。
  #
  # 它是「当前该加载哪些 chunk」的唯一索引。一旦被缓存，用户就会拿着上一版的
  # 索引去要已经不存在的 chunk——正是上面那个错误的来源。
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

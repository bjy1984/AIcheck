# AIcheck 网关配置。
#
# 2026-08-14 之前这份文件只存在于服务器 /home/dev-bjy/aicheck-web/conf/，
# 不在版本管理内——和 build_runtime_env.py 一样，部署行为的一部分没有 diff、
# 没法回滚。现在由部署脚本从仓库同步过去。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 512m;

  location /api/ {
    proxy_pass http://aicheck-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ONLYOFFICE Document Server：Office 文件在线预览（只读）。
  # 经本机 nginx 反代而不是直接暴露端口——浏览器与页面同源，省掉跨域配置，
  # 也避免把 DS 的管理面直接挂到公网。
  location /onlyoffice/ {
    proxy_pass http://onlyoffice/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # DS 的协作通道走 WebSocket，缺这两行会一直重连
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 构建产物：**不走 SPA 回退**。
  #
  # 原先所有路径都落到 `try_files $uri $uri/ /index.html`，包括 /assets/*.js。
  # 前端每次构建 chunk 哈希全变、旧 chunk 被删，而浏览器缓存里的 index.html
  # 仍指向旧名字——于是请求一个已删除的 .js，nginx 回 200 + index.html 的 HTML。
  #
  # 浏览器随后报：
  #   Failed to load module script: Expected a JavaScript-or-Wasm module script
  #   but the server responded with a MIME type of "text/html".
  #
  # 这个报错与真实原因（你手上的页面是上一版）毫不相干，用户只看到「登录时弹错误」。
  # 2026-08-14 用户实际撞到过。
  #
  # 改成对缺失的构建产物直接 404：错误变得可自解释，前端也能据此提示用户刷新。
  location /assets/ {
    try_files $uri =404;
    # 带哈希的文件名天然可长期缓存；index.html 另行处理（见下）。
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html 绝不缓存。
  #
  # 它是「当前该加载哪些 chunk」的唯一索引。一旦被缓存，用户就会拿着上一版的
  # 索引去要已经不存在的 chunk——正是上面那个错误的来源。
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

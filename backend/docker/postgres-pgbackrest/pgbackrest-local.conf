[aicheck]
pg1-path=/var/lib/postgresql/data

[global]
archive-async=y
archive-timeout=60s
compress-type=zst
log-level-console=info
process-max=2
repo1-bundle=y
repo1-cipher-type=aes-256-cbc
repo1-path=/pgbackrest/aicheck
repo1-retention-archive=6
repo1-retention-archive-type=full
repo1-retention-diff=35
repo1-retention-full=6
repo1-type=posix
spool-path=/var/spool/pgbackrest
start-fast=y

[global:archive-push]
compress-level=3

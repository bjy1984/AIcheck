schemaVersion: aicheck-ocr-runtime@1
modeEnv: AICHECK_OCR_PROVIDER_MODE
defaultMode: hybrid_auto

render:
  maxLongSide: 1920
  qwenMaxLongSide: 1920
  jpegQuality: 90
  maxPages: 30

providers:
  local:
    heavyFallbackEnabled: false

  aliyun_official:
    baseUrlEnv: AICHECK_ALIYUN_OCR_BASE_URL
    apiKeyEnv: AICHECK_ALIYUN_OCR_API_KEY
    defaultBaseUrl: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
    primaryModel: qwen3.5-ocr
    comparisonModel: qwen-vl-ocr-2025-11-20
    timeoutSeconds: 60
    circuitFailureThreshold: 3
    circuitOpenSeconds: 60
    maxAttempts: 3
    maxOutputTokens: 16384

routing:
  electronicPdf: local_text_layer
  scannedPage: aliyun_advanced_recognition
  requiredTable: aliyun_table_parsing
  unresolvedFields: aliyun_key_information_extraction
  seal: local_color_candidate_then_aliyun_roi
  signature: advisory_only

fallback:
  allowLocalHeavyFallback: false
  allowSilentProviderFallback: false

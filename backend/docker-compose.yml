services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      AICHECK_MONGO_URL: ${AICHECK_MONGO_URL:-mongodb://mongodb:27017}
      AICHECK_MONGO_DB: ${AICHECK_MONGO_DB:-aicheck}
      AICHECK_REDIS_URL: ${AICHECK_REDIS_URL:-redis://redis:6379/0}
      AICHECK_TASK_DISPATCH: ${AICHECK_TASK_DISPATCH:-celery}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_ENDPOINT:-minio:9000}
      AICHECK_MINIO_PUBLIC_ENDPOINT: ${AICHECK_MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:-aicheck-dev-password}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-aicheck-dev}
      AICHECK_REQUIRE_AUTH: ${AICHECK_REQUIRE_AUTH:-false}
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
      - minio
      - litellm-service

  worker-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO -Q ocr.parse_document,ocr.recognize_seals,knowledge.slice,knowledge.embed,inspection.ai_recheck,llm.compare,export.package
    environment:
      AICHECK_MONGO_URL: ${AICHECK_MONGO_URL:-mongodb://mongodb:27017}
      AICHECK_MONGO_DB: ${AICHECK_MONGO_DB:-aicheck}
      AICHECK_REDIS_URL: ${AICHECK_REDIS_URL:-redis://redis:6379/0}
      AICHECK_TASK_DISPATCH: ${AICHECK_TASK_DISPATCH:-celery}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_ENDPOINT:-minio:9000}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:-aicheck-dev-password}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-aicheck-dev}
    depends_on:
      - mongodb
      - redis
      - api-service
      - minio
      - litellm-service

  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn apps.ocr_service.main:app --host 0.0.0.0 --port 8010
    environment:
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_ENDPOINT:-minio:9000}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:-aicheck-dev-password}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
    ports:
      - "8010:8010"
    depends_on:
      - minio

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      MINIO_ROOT_PASSWORD: ${AICHECK_MINIO_SECRET_KEY:-aicheck-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  litellm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-litellm}
    ports:
      - "5433:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data

  litellm-service:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-litellm}:${LITELLM_POSTGRES_PASSWORD:-litellm}@litellm-postgres:5432/${LITELLM_POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-aicheck-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "4001:4000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - litellm-postgres

volumes:
  mongo-data:
  minio-data:
  litellm-postgres-data:

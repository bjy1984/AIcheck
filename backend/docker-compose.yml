services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      AICHECK_MONGO_URL: ${AICHECK_MONGO_URL:-mongodb://mongodb:27017/?replicaSet=rs0}
      AICHECK_MONGO_DB: ${AICHECK_MONGO_DB:-aicheck}
      AICHECK_MONGO_TRANSACTIONS: ${AICHECK_MONGO_TRANSACTIONS:-true}
      AICHECK_REDIS_URL: ${AICHECK_REDIS_URL:-redis://redis:6379/0}
      AICHECK_TASK_DISPATCH: ${AICHECK_TASK_DISPATCH:-celery}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_ENDPOINT:-minio:9000}
      AICHECK_MINIO_PUBLIC_ENDPOINT: ${AICHECK_MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_JWT_SECRET: ${AICHECK_JWT_SECRET:?AICHECK_JWT_SECRET is required}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      AICHECK_REQUIRE_AUTH: ${AICHECK_REQUIRE_AUTH:-true}
      AICHECK_ENABLE_DEMO_USERS: ${AICHECK_ENABLE_DEMO_USERS:-false}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO -Q ocr.parse_document,ocr.recognize_seals,knowledge.slice,knowledge.embed,inspection.ai_recheck,llm.compare,export.package
    environment:
      AICHECK_MONGO_URL: ${AICHECK_MONGO_URL:-mongodb://mongodb:27017/?replicaSet=rs0}
      AICHECK_MONGO_DB: ${AICHECK_MONGO_DB:-aicheck}
      AICHECK_MONGO_TRANSACTIONS: ${AICHECK_MONGO_TRANSACTIONS:-true}
      AICHECK_REDIS_URL: ${AICHECK_REDIS_URL:-redis://redis:6379/0}
      AICHECK_TASK_DISPATCH: ${AICHECK_TASK_DISPATCH:-celery}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_ENDPOINT:-minio:9000}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_OCR_BASE_URL: ${AICHECK_OCR_BASE_URL:-http://ocr-service:8010}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      litellm-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A apps.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 6

  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    command: uvicorn apps.ocr_service.main:app --host 0.0.0.0 --port 8010
    environment:
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_ENDPOINT:-minio:9000}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_AGENTDESIGN_BACKEND: ${AICHECK_AGENTDESIGN_BACKEND:-/opt/agentdesign/mvp-system/backend}
      AICHECK_OCR_ALLOW_PLACEHOLDER: ${AICHECK_OCR_ALLOW_PLACEHOLDER:-false}
      AICHECK_OCR_OFFLINE_ONLY: ${AICHECK_OCR_OFFLINE_ONLY:-true}
      AICHECK_OCR_DISABLE_NETWORK: ${AICHECK_OCR_DISABLE_NETWORK:-true}
      PADDLEOCR_MODEL_DIR: ${PADDLEOCR_MODEL_DIR:-/models/paddleocr}
      PADDLEX_MODEL_DIR: ${PADDLEX_MODEL_DIR:-/models/paddlex}
      PADDLEOCR_VL_MODEL_DIR: ${PADDLEOCR_VL_MODEL_DIR:-/models/paddleocr-vl}
      DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/models/docling}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PADDLE_PDX_MODEL_SOURCE: local
    ports:
      - "8010:8010"
    volumes:
      - ${AICHECK_AGENTDESIGN_HOST_PATH:?AICHECK_AGENTDESIGN_HOST_PATH is required}:/opt/agentdesign:ro
      - ${AICHECK_OCR_MODELS_HOST_PATH:?AICHECK_OCR_MODELS_HOST_PATH is required}:/models:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongodb:27017\"}]}).ok }'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      MINIO_ROOT_PASSWORD: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm-service:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-litellm}:${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}@litellm-postgres:5432/${LITELLM_POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      NO_PROXY: ${AICHECK_LITELLM_NO_PROXY:-127.0.0.1,localhost,::1,litellm-postgres}
      no_proxy: ${AICHECK_LITELLM_NO_PROXY:-127.0.0.1,localhost,::1,litellm-postgres}
    ports:
      - "4001:4000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      litellm-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, os, sys, urllib.request; req=urllib.request.Request('http://127.0.0.1:4000/health', headers={'Authorization': 'Bearer ' + os.environ['LITELLM_MASTER_KEY']}); data=json.loads(urllib.request.urlopen(req, timeout=3).read() or b'{}'); sys.exit(1 if int(data.get('unhealthy_count') or 0) else 0)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
  minio-data:
  litellm-postgres-data:

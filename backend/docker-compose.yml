services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      AICHECK_DATABASE_URL: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${AICHECK_POSTGRES_DB:-aicheck}
      AICHECK_TENANT_ID: ${AICHECK_TENANT_ID:?AICHECK_TENANT_ID is required}
      AICHECK_TENANT_MODE: ${AICHECK_TENANT_MODE:-shared}
      AICHECK_SQLITE_FALLBACK: ${AICHECK_SQLITE_FALLBACK:-false}
      AICHECK_REDIS_URL: ${AICHECK_REDIS_INTERNAL_URL:-redis://redis:6379/0}
      AICHECK_TASK_DISPATCH: ${AICHECK_TASK_DISPATCH:-celery}
      AICHECK_REVIEW_ORCHESTRATION: ${AICHECK_REVIEW_ORCHESTRATION:-temporal}
      AICHECK_AUDIT_INPUT_MODE: ${AICHECK_AUDIT_INPUT_MODE:-ocr_llm}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal-service:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      AICHECK_REVIEW_WORKFLOW_TASK_QUEUE: ${AICHECK_REVIEW_WORKFLOW_TASK_QUEUE:-review.workflow}
      AICHECK_IDEMPOTENCY_LOCK_TIMEOUT_MS: ${AICHECK_IDEMPOTENCY_LOCK_TIMEOUT_MS:-5000}
      AICHECK_REVIEW_LLM_EXECUTION: ${AICHECK_REVIEW_LLM_EXECUTION:-litellm}
      AICHECK_LANGGRAPH_DISABLE: ${AICHECK_LANGGRAPH_DISABLE:-false}
      AICHECK_LANGGRAPH_CHECKPOINT_DISABLE: ${AICHECK_LANGGRAPH_CHECKPOINT_DISABLE:-false}
      AICHECK_LANGGRAPH_CHECKPOINT_SETUP: ${AICHECK_LANGGRAPH_CHECKPOINT_SETUP:-false}
      LANGGRAPH_CHECKPOINT_DSN: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${WORKFLOW_POSTGRES_DB:-workflow}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_INTERNAL_ENDPOINT:-minio:9000}
      AICHECK_MINIO_PUBLIC_ENDPOINT: ${AICHECK_MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
      AICHECK_MINIO_BUCKET_PREFIX: ${AICHECK_MINIO_BUCKET_PREFIX:-}
      AICHECK_MINIO_OBJECT_NAMESPACE: ${AICHECK_MINIO_OBJECT_NAMESPACE:-}
      AICHECK_MINIO_DOCUMENTS_BUCKET: ${AICHECK_MINIO_DOCUMENTS_BUCKET:-}
      AICHECK_MINIO_PREVIEWS_BUCKET: ${AICHECK_MINIO_PREVIEWS_BUCKET:-}
      AICHECK_MINIO_EXPORTS_BUCKET: ${AICHECK_MINIO_EXPORTS_BUCKET:-}
      AICHECK_MINIO_OCR_ARTIFACTS_BUCKET: ${AICHECK_MINIO_OCR_ARTIFACTS_BUCKET:-}
      AICHECK_MINIO_AUDIT_ANCHORS_BUCKET: ${AICHECK_MINIO_AUDIT_ANCHORS_BUCKET:-audit-anchors}
      AICHECK_RAW_VAULT_BUCKET: ${AICHECK_RAW_VAULT_BUCKET:-agent-raw-vault}
      AICHECK_RAW_VAULT_POLL_SECONDS: ${AICHECK_RAW_VAULT_POLL_SECONDS:-1}
      AICHECK_RAW_VAULT_BATCH_SIZE: ${AICHECK_RAW_VAULT_BATCH_SIZE:-20}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_REQUIRE_AUDIT_ANCHOR: ${AICHECK_REQUIRE_AUDIT_ANCHOR:-true}
      AICHECK_AUDIT_ANCHOR_OBJECT_LOCK: ${AICHECK_AUDIT_ANCHOR_OBJECT_LOCK:?AICHECK_AUDIT_ANCHOR_OBJECT_LOCK must confirm bucket retention}
      AICHECK_AUDIT_ANCHOR_RETENTION_DAYS: ${AICHECK_AUDIT_ANCHOR_RETENTION_DAYS:-3650}
      AICHECK_JWT_SECRET: ${AICHECK_JWT_SECRET:?AICHECK_JWT_SECRET is required}
      AICHECK_JWT_ISSUER: ${AICHECK_JWT_ISSUER:-aicheck-api}
      AICHECK_JWT_AUDIENCE: ${AICHECK_JWT_AUDIENCE:-aicheck-frontend}
      AICHECK_JWT_TTL_MINUTES: ${AICHECK_JWT_TTL_MINUTES:-720}
      AICHECK_STRICT_PRODUCTION: ${AICHECK_STRICT_PRODUCTION:-true}
      AICHECK_ALLOW_DEV_TOKENS: ${AICHECK_ALLOW_DEV_TOKENS:-false}
      AICHECK_ENABLE_COMPATIBILITY_MOCKS: ${AICHECK_ENABLE_COMPATIBILITY_MOCKS:-false}
      AICHECK_CORS_ALLOWED_ORIGINS: ${AICHECK_CORS_ALLOWED_ORIGINS:?AICHECK_CORS_ALLOWED_ORIGINS is required}
      AICHECK_ALLOWED_HOSTS: ${AICHECK_ALLOWED_HOSTS:?AICHECK_ALLOWED_HOSTS is required}
      AICHECK_TRUST_PROXY: ${AICHECK_TRUST_PROXY:-false}
      AICHECK_TRUSTED_PROXIES: ${AICHECK_TRUSTED_PROXIES:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      AICHECK_QWEN_CALL_MODE: ${AICHECK_QWEN_CALL_MODE:-server}
      AICHECK_QWEN_ALLOW_SERVER_FALLBACK: ${AICHECK_QWEN_ALLOW_SERVER_FALLBACK:-false}
      QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      AICHECK_AUDIT_MODEL_COMPARISON_MODE: ${AICHECK_AUDIT_MODEL_COMPARISON_MODE:-off}
      AICHECK_AUDIT_MODEL_COMPARISON_SAMPLE_RATE: ${AICHECK_AUDIT_MODEL_COMPARISON_SAMPLE_RATE:-1.0}
      AICHECK_QWEN_VL_AUDIT_MODEL: ${AICHECK_QWEN_VL_AUDIT_MODEL:-qwen3.7-plus}
      AICHECK_DEEPSEEK_AUDIT_MODEL: ${AICHECK_DEEPSEEK_AUDIT_MODEL:-deepseek-v4-pro}
      AICHECK_EMBEDDING_PROVIDER: ${AICHECK_EMBEDDING_PROVIDER:-local}
      AICHECK_EMBEDDING_API_BASE: ${AICHECK_EMBEDDING_API_BASE:-http://embedding-service:7997}
      AICHECK_EMBEDDING_API_KEY: ${AICHECK_EMBEDDING_API_KEY:-}
      AICHECK_EMBEDDING_MODEL_ID: ${AICHECK_EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      AICHECK_EMBEDDING_SERVED_MODEL_NAME: ${AICHECK_EMBEDDING_SERVED_MODEL_NAME:-embedding-default}
      AICHECK_EMBEDDING_BATCH_SIZE: ${AICHECK_EMBEDDING_BATCH_SIZE:-32}
      AICHECK_EMBEDDING_CHECKPOINT_BATCH_SIZE: ${AICHECK_EMBEDDING_CHECKPOINT_BATCH_SIZE:-8}
      AICHECK_EMBEDDING_FORCE_OFFLINE_HASH: ${AICHECK_EMBEDDING_FORCE_OFFLINE_HASH:-false}
      AICHECK_EMBEDDING_ALLOW_HASH_FALLBACK: ${AICHECK_EMBEDDING_ALLOW_HASH_FALLBACK:-false}
      AICHECK_OCR_BASE_URL: ${AICHECK_OCR_BASE_URL:-http://ocr-service:8010}
      AICHECK_OCR_USE_JOB_API: "false"
      AICHECK_CPU_HEAVY_DISK_GATE: ${AICHECK_CPU_HEAVY_DISK_GATE:-true}
      AICHECK_CAPACITY_GATE_PATH: ${AICHECK_CAPACITY_GATE_PATH:-/}
      AICHECK_DISK_WARNING_PERCENT: ${AICHECK_DISK_WARNING_PERCENT:-80}
      AICHECK_DISK_PAUSE_PERCENT: ${AICHECK_DISK_PAUSE_PERCENT:-88}
      AICHECK_DISK_FAIL_PERCENT: ${AICHECK_DISK_FAIL_PERCENT:-92}
      AICHECK_REQUIRE_AUTH: ${AICHECK_REQUIRE_AUTH:-true}
      AICHECK_ENABLE_DEMO_USERS: ${AICHECK_ENABLE_DEMO_USERS:-false}
      AICHECK_ENABLE_DEMO_DATA: ${AICHECK_ENABLE_DEMO_DATA:-false}
      AICHECK_CNSE_ORIGIN: ${AICHECK_CNSE_ORIGIN:-https://cnse.e-cqs.cn}
      AICHECK_CNSE_MIN_CONFIDENCE: ${AICHECK_CNSE_MIN_CONFIDENCE:-0.50}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm-service:
        condition: service_healthy
      temporal-service:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker-service: &worker-service
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=${AICHECK_BUSINESS_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1 -Q business.light,ocr.parse_document
    restart: unless-stopped
    environment: &worker-environment
      AICHECK_STRICT_PRODUCTION: ${AICHECK_STRICT_PRODUCTION:-true}
      AICHECK_ENABLE_DEMO_DATA: ${AICHECK_ENABLE_DEMO_DATA:-false}
      AICHECK_OCR_DEFAULT_PROVIDER: ${AICHECK_OCR_DEFAULT_PROVIDER:-mineru}
      AICHECK_DATABASE_URL: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${AICHECK_POSTGRES_DB:-aicheck}
      AICHECK_TENANT_ID: ${AICHECK_TENANT_ID:?AICHECK_TENANT_ID is required}
      AICHECK_SQLITE_FALLBACK: ${AICHECK_SQLITE_FALLBACK:-false}
      AICHECK_REDIS_URL: ${AICHECK_REDIS_INTERNAL_URL:-redis://redis:6379/0}
      AICHECK_TASK_DISPATCH: ${AICHECK_TASK_DISPATCH:-celery}
      AICHECK_REVIEW_ORCHESTRATION: ${AICHECK_REVIEW_ORCHESTRATION:-temporal}
      AICHECK_AUDIT_INPUT_MODE: ${AICHECK_AUDIT_INPUT_MODE:-ocr_llm}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_INTERNAL_ENDPOINT:-minio:9000}
      AICHECK_MINIO_BUCKET_PREFIX: ${AICHECK_MINIO_BUCKET_PREFIX:-}
      AICHECK_MINIO_OBJECT_NAMESPACE: ${AICHECK_MINIO_OBJECT_NAMESPACE:-}
      AICHECK_MINIO_DOCUMENTS_BUCKET: ${AICHECK_MINIO_DOCUMENTS_BUCKET:-}
      AICHECK_MINIO_PREVIEWS_BUCKET: ${AICHECK_MINIO_PREVIEWS_BUCKET:-}
      AICHECK_MINIO_EXPORTS_BUCKET: ${AICHECK_MINIO_EXPORTS_BUCKET:-}
      AICHECK_MINIO_OCR_ARTIFACTS_BUCKET: ${AICHECK_MINIO_OCR_ARTIFACTS_BUCKET:-}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_OCR_BASE_URL: ${AICHECK_OCR_BASE_URL:-http://ocr-service:8010}
      AICHECK_OCR_PIPELINE_MODE: ${AICHECK_OCR_PIPELINE_MODE:-shadow}
      AICHECK_OCR_PIPELINE_VERSION: ${AICHECK_OCR_PIPELINE_VERSION:-ocr-accuracy-first@2}
      AICHECK_OCR_PIPELINE_PROFILE_ALLOWLIST: ${AICHECK_OCR_PIPELINE_PROFILE_ALLOWLIST:-qualification_certificate_v1,construction_record_v1,construction_plan_v1,welding_procedure_qualification_v1,ndt_rt_report_v1,quality_certificate_v1,acceptance_witness_record_v1,sampling_witness_record_v1,material_retest_report_v1,material_ndt_report_v1,engineering_drawing_list_v1,drawing_material_list_v1,process_flow_diagram_v1,strength_calculation_v1,design_specification_v1,equipment_list_v1,site_layout_drawing_v1,paint_insulation_list_v1,piping_characteristic_list_v1,comprehensive_material_list_v1}
      AICHECK_OCR_QWEN_IMAGE_POLICY: ${AICHECK_OCR_QWEN_IMAGE_POLICY:-page_and_roi}
      AICHECK_OCR_QWEN_MAX_PAGES: ${AICHECK_OCR_QWEN_MAX_PAGES:-60}
      AICHECK_OCR_QWEN_MAX_TOKENS: ${AICHECK_OCR_QWEN_MAX_TOKENS:-3200}
      AICHECK_OCR_QWEN_TIMEOUT_SECONDS: ${AICHECK_OCR_QWEN_TIMEOUT_SECONDS:-180}
      AICHECK_QWEN_INPUT_CNY_PER_MILLION: ${AICHECK_QWEN_INPUT_CNY_PER_MILLION:-2}
      AICHECK_QWEN_OUTPUT_CNY_PER_MILLION: ${AICHECK_QWEN_OUTPUT_CNY_PER_MILLION:-8}
      AICHECK_DOCUMENT_AI_MODE: off
      AICHECK_DOCUMENT_AI_BASE_URL: ${AICHECK_DOCUMENT_AI_BASE_URL:-}
      AICHECK_DOCUMENT_AI_API_KEY: ${AICHECK_DOCUMENT_AI_API_KEY:-}
      AICHECK_DOCUMENT_AI_PROFILE_ALLOWLIST: ${AICHECK_DOCUMENT_AI_PROFILE_ALLOWLIST:-ndt_rt_report_v1,quality_certificate_v1,acceptance_witness_record_v1,sampling_witness_record_v1,material_retest_report_v1,material_ndt_report_v1,engineering_drawing_list_v1,piping_characteristic_list_v1,comprehensive_material_list_v1}
      AICHECK_DOCUMENT_AI_TIMEOUT_SECONDS: ${AICHECK_DOCUMENT_AI_TIMEOUT_SECONDS:-180}
      AICHECK_AUDIT_MODEL_COMPARISON_MODE: off
      AICHECK_AUDIT_MODEL_COMPARISON_SAMPLE_RATE: ${AICHECK_AUDIT_MODEL_COMPARISON_SAMPLE_RATE:-1.0}
      AICHECK_QWEN_VL_AUDIT_MODEL: ${AICHECK_QWEN_VL_AUDIT_MODEL:-qwen3.7-plus}
      AICHECK_DEEPSEEK_AUDIT_MODEL: ${AICHECK_DEEPSEEK_AUDIT_MODEL:-deepseek-v4-pro}
      AICHECK_DEEPSEEK_AUDIT_MAX_TOKENS: ${AICHECK_DEEPSEEK_AUDIT_MAX_TOKENS:-2400}
      AICHECK_DEEPSEEK_AUDIT_TIMEOUT_SECONDS: ${AICHECK_DEEPSEEK_AUDIT_TIMEOUT_SECONDS:-180}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      AICHECK_QWEN_CALL_MODE: ${AICHECK_QWEN_CALL_MODE:-server}
      AICHECK_QWEN_ALLOW_SERVER_FALLBACK: ${AICHECK_QWEN_ALLOW_SERVER_FALLBACK:-false}
      QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      AICHECK_EMBEDDING_PROVIDER: ${AICHECK_EMBEDDING_PROVIDER:-local}
      # 默认值必须和 api 那份一致。**真正做向量化的是这个 worker**，
      # 而这里原先默认空串：没在 .env 里显式配的部署，api 看着是好的、
      # worker 拿到空地址，EmbeddingClient 不启用 → embed_knowledge 直接
      # 抛 embedding_client_not_configured → 资料永远停在「待向量化」→
      # 报审被永久拦下。线上就是这个形态（0818 实测 36 份待向量化）。
      AICHECK_EMBEDDING_API_BASE: ${AICHECK_EMBEDDING_API_BASE:-http://embedding-service:7997}
      AICHECK_EMBEDDING_API_KEY: ${AICHECK_EMBEDDING_API_KEY:-}
      AICHECK_EMBEDDING_MODEL_ID: ${AICHECK_EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      AICHECK_EMBEDDING_SERVED_MODEL_NAME: ${AICHECK_EMBEDDING_SERVED_MODEL_NAME:-embedding-default}
      AICHECK_EMBEDDING_BATCH_SIZE: ${AICHECK_EMBEDDING_BATCH_SIZE:-32}
      AICHECK_EMBEDDING_FORCE_OFFLINE_HASH: ${AICHECK_EMBEDDING_FORCE_OFFLINE_HASH:-false}
      AICHECK_EMBEDDING_ALLOW_HASH_FALLBACK: ${AICHECK_EMBEDDING_ALLOW_HASH_FALLBACK:-false}
      AICHECK_CPU_HEAVY_DISK_GATE: ${AICHECK_CPU_HEAVY_DISK_GATE:-true}
      AICHECK_CAPACITY_GATE_PATH: ${AICHECK_CAPACITY_GATE_PATH:-/}
      AICHECK_DISK_WARNING_PERCENT: ${AICHECK_DISK_WARNING_PERCENT:-80}
      AICHECK_DISK_PAUSE_PERCENT: ${AICHECK_DISK_PAUSE_PERCENT:-88}
      AICHECK_DISK_FAIL_PERCENT: ${AICHECK_DISK_FAIL_PERCENT:-92}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      litellm-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A apps.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 6

  document-ai-shadow-worker-service:
    <<: *worker-service
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 -Q document-ai.shadow
    profiles: ["experimental-document-ai"]

  audit-pipeline-comparison-worker-service:
    <<: *worker-service
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 -Q audit-pipeline.compare
    profiles: ["experimental-document-ai"]

  cpu-heavy-worker-service:
    <<: *worker-service
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 -Q cpu.heavy

  ocr-remote-worker-service:
    <<: *worker-service
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=2 --prefetch-multiplier=1 -Q ocr.remote
    environment:
      <<: *worker-environment
      AICHECK_MINERU_BASE_URL: ${AICHECK_MINERU_BASE_URL:-https://mineru.net}
      AICHECK_MINERU_API_KEY: ${AICHECK_MINERU_API_KEY:?AICHECK_MINERU_API_KEY is required}
      AICHECK_MINERU_MODEL_VERSION: vlm
      AICHECK_MINERU_TIMEOUT_SECONDS: ${AICHECK_MINERU_TIMEOUT_SECONDS:-60}
      AICHECK_MINERU_POLL_INTERVAL_SECONDS: ${AICHECK_MINERU_POLL_INTERVAL_SECONDS:-3}
      AICHECK_MINERU_JOB_TIMEOUT_SECONDS: ${AICHECK_MINERU_JOB_TIMEOUT_SECONDS:-1800}
      AICHECK_MINERU_MAX_DOWNLOAD_BYTES: ${AICHECK_MINERU_MAX_DOWNLOAD_BYTES:-536870912}

  llm-remote-worker-service:
    <<: *worker-service
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 -Q llm.remote

  review-worker-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m apps.review_worker.main
    restart: unless-stopped
    environment:
      AICHECK_STRICT_PRODUCTION: ${AICHECK_STRICT_PRODUCTION:-true}
      AICHECK_DATABASE_URL: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${AICHECK_POSTGRES_DB:-aicheck}
      AICHECK_TENANT_ID: ${AICHECK_TENANT_ID:?AICHECK_TENANT_ID is required}
      AICHECK_TENANT_MODE: ${AICHECK_TENANT_MODE:-shared}
      AICHECK_SQLITE_FALLBACK: ${AICHECK_SQLITE_FALLBACK:-false}
      AICHECK_REVIEW_ORCHESTRATION: temporal
      AICHECK_AUDIT_INPUT_MODE: ${AICHECK_AUDIT_INPUT_MODE:-ocr_llm}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal-service:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      AICHECK_REVIEW_WORKFLOW_TASK_QUEUE: ${AICHECK_REVIEW_WORKFLOW_TASK_QUEUE:-review.workflow}
      AICHECK_REVIEW_WORKER_MAX_CONCURRENT_ACTIVITIES: ${AICHECK_REVIEW_WORKER_MAX_CONCURRENT_ACTIVITIES:-1}
      AICHECK_REVIEW_GRAPH_TASK_QUEUE: ${AICHECK_REVIEW_GRAPH_TASK_QUEUE:-review.graph}
      AICHECK_REVIEW_LLM_TASK_QUEUE: ${AICHECK_REVIEW_LLM_TASK_QUEUE:-review.llm}
      AICHECK_REVIEW_RETRIEVAL_TASK_QUEUE: ${AICHECK_REVIEW_RETRIEVAL_TASK_QUEUE:-review.retrieval}
      AICHECK_REVIEW_VALIDATION_TASK_QUEUE: ${AICHECK_REVIEW_VALIDATION_TASK_QUEUE:-review.validation}
      AICHECK_REVIEW_LLM_EXECUTION: ${AICHECK_REVIEW_LLM_EXECUTION:-litellm}
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_INTERNAL_ENDPOINT:-minio:9000}
      AICHECK_MINIO_BUCKET_PREFIX: ${AICHECK_MINIO_BUCKET_PREFIX:-}
      AICHECK_MINIO_OBJECT_NAMESPACE: ${AICHECK_MINIO_OBJECT_NAMESPACE:-}
      AICHECK_MINIO_AUDIT_ANCHORS_BUCKET: ${AICHECK_MINIO_AUDIT_ANCHORS_BUCKET:-audit-anchors}
      AICHECK_RAW_VAULT_BUCKET: ${AICHECK_RAW_VAULT_BUCKET:-agent-raw-vault}
      AICHECK_RAW_VAULT_POLL_SECONDS: ${AICHECK_RAW_VAULT_POLL_SECONDS:-1}
      AICHECK_RAW_VAULT_BATCH_SIZE: ${AICHECK_RAW_VAULT_BATCH_SIZE:-20}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_REQUIRE_AUDIT_ANCHOR: ${AICHECK_REQUIRE_AUDIT_ANCHOR:-true}
      AICHECK_AUDIT_ANCHOR_OBJECT_LOCK: ${AICHECK_AUDIT_ANCHOR_OBJECT_LOCK:?AICHECK_AUDIT_ANCHOR_OBJECT_LOCK must confirm bucket retention}
      AICHECK_AUDIT_ANCHOR_RETENTION_DAYS: ${AICHECK_AUDIT_ANCHOR_RETENTION_DAYS:-3650}
      AICHECK_LANGGRAPH_DISABLE: ${AICHECK_LANGGRAPH_DISABLE:-false}
      AICHECK_LANGGRAPH_CHECKPOINT_DISABLE: ${AICHECK_LANGGRAPH_CHECKPOINT_DISABLE:-false}
      AICHECK_LANGGRAPH_CHECKPOINT_SETUP: ${AICHECK_LANGGRAPH_CHECKPOINT_SETUP:-false}
      LANGGRAPH_CHECKPOINT_DSN: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${WORKFLOW_POSTGRES_DB:-workflow}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-service:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      AICHECK_QWEN_CALL_MODE: ${AICHECK_QWEN_CALL_MODE:-server}
      AICHECK_QWEN_ALLOW_SERVER_FALLBACK: ${AICHECK_QWEN_ALLOW_SERVER_FALLBACK:-false}
      QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    depends_on:
      temporal-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      litellm-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import asyncio, os; from temporalio.client import Client; asyncio.run(Client.connect(os.environ['TEMPORAL_ADDRESS'], namespace=os.environ.get('TEMPORAL_NAMESPACE', 'default')))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 6

  workflow-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: /bin/sh -c "python -m scripts.migrate_backend && python -m scripts.setup_langgraph_checkpoint"
    environment:
      AICHECK_DATABASE_URL: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${AICHECK_POSTGRES_DB:-aicheck}
      AICHECK_TENANT_ID: ${AICHECK_TENANT_ID:?AICHECK_TENANT_ID is required}
      LANGGRAPH_CHECKPOINT_DSN: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${WORKFLOW_POSTGRES_DB:-workflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["migration"]

  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile.ocr
      args:
        AICHECK_APT_DEBIAN_MIRROR: ${AICHECK_APT_DEBIAN_MIRROR:-}
        AICHECK_APT_SECURITY_MIRROR: ${AICHECK_APT_SECURITY_MIRROR:-}
        AICHECK_PIP_INDEX_URL: ${AICHECK_PIP_INDEX_URL:-}
        AICHECK_OCR_REQUIREMENTS: ${AICHECK_OCR_REQUIREMENTS:-requirements-ocr-core.txt}
    command: uvicorn apps.ocr_service.main:app --host 0.0.0.0 --port 8010
    environment:
      AICHECK_MINIO_ENDPOINT: ${AICHECK_MINIO_INTERNAL_ENDPOINT:-minio:9000}
      AICHECK_MINIO_BUCKET_PREFIX: ${AICHECK_MINIO_BUCKET_PREFIX:-}
      AICHECK_MINIO_OBJECT_NAMESPACE: ${AICHECK_MINIO_OBJECT_NAMESPACE:-}
      AICHECK_MINIO_DOCUMENTS_BUCKET: ${AICHECK_MINIO_DOCUMENTS_BUCKET:-}
      AICHECK_MINIO_PREVIEWS_BUCKET: ${AICHECK_MINIO_PREVIEWS_BUCKET:-}
      AICHECK_MINIO_EXPORTS_BUCKET: ${AICHECK_MINIO_EXPORTS_BUCKET:-}
      AICHECK_MINIO_OCR_ARTIFACTS_BUCKET: ${AICHECK_MINIO_OCR_ARTIFACTS_BUCKET:-}
      AICHECK_MINIO_ACCESS_KEY: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      AICHECK_MINIO_SECRET_KEY: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
      AICHECK_MINIO_SECURE: ${AICHECK_MINIO_SECURE:-false}
      AICHECK_AGENTDESIGN_BACKEND: ${AICHECK_AGENTDESIGN_BACKEND:-/opt/agentdesign/mvp-system/backend}
      AICHECK_OCR_ALLOW_PLACEHOLDER: ${AICHECK_OCR_ALLOW_PLACEHOLDER:-false}
      AICHECK_OCR_OFFLINE_ONLY: ${AICHECK_OCR_OFFLINE_ONLY:-true}
      AICHECK_OCR_DISABLE_NETWORK: ${AICHECK_OCR_DISABLE_NETWORK:-true}
      PADDLEOCR_MODEL_DIR: ${PADDLEOCR_MODEL_DIR:-/models/paddleocr}
      PADDLEX_MODEL_DIR: ${PADDLEX_MODEL_DIR:-/models/paddlex}
      AICHECK_PADDLEX_MODEL_CACHE: ${AICHECK_PADDLEX_MODEL_CACHE:-/models/paddlex}
      AICHECK_PADDLEOCR_DET_MODEL_DIR: ${AICHECK_PADDLEOCR_DET_MODEL_DIR:-/models/paddleocr/PP-OCRv6_medium_det}
      AICHECK_PADDLEOCR_REC_MODEL_DIR: ${AICHECK_PADDLEOCR_REC_MODEL_DIR:-/models/paddleocr/PP-OCRv6_medium_rec}
      AICHECK_OCR_SUBPROCESS_PYTHON: ${AICHECK_OCR_SUBPROCESS_PYTHON:-/usr/local/bin/python}
      AICHECK_OCR_ENABLE_PERSISTENT_SUBPROCESS: ${AICHECK_OCR_ENABLE_PERSISTENT_SUBPROCESS:-true}
      AICHECK_OCR_PERSISTENT_WORKER_TIMEOUT: ${AICHECK_OCR_PERSISTENT_WORKER_TIMEOUT:-180}
      AICHECK_OCR_DEEP_READY_PROBE: ${AICHECK_OCR_DEEP_READY_PROBE:-true}
      AICHECK_OCR_MIN_MEMORY_HEADROOM_MB: ${AICHECK_OCR_MIN_MEMORY_HEADROOM_MB:-2048}
      AICHECK_OCR_DISK_READINESS_GATE: ${AICHECK_OCR_DISK_READINESS_GATE:-true}
      AICHECK_CAPACITY_GATE_PATH: ${AICHECK_CAPACITY_GATE_PATH:-/}
      AICHECK_DISK_WARNING_PERCENT: ${AICHECK_DISK_WARNING_PERCENT:-80}
      AICHECK_DISK_PAUSE_PERCENT: ${AICHECK_DISK_PAUSE_PERCENT:-88}
      AICHECK_DISK_FAIL_PERCENT: ${AICHECK_DISK_FAIL_PERCENT:-92}
      AICHECK_PADDLEOCR_MEMORY_LIMIT_MB: ${AICHECK_PADDLEOCR_MEMORY_LIMIT_MB:-4096}
      AICHECK_PP_STRUCTURE_MEMORY_LIMIT_MB: ${AICHECK_PP_STRUCTURE_MEMORY_LIMIT_MB:-6144}
      AICHECK_PADDLEX_SEAL_MEMORY_LIMIT_MB: ${AICHECK_PADDLEX_SEAL_MEMORY_LIMIT_MB:-3072}
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "4"
      AICHECK_PPSTRUCTURE_LAYOUT_MODEL_DIR: ${AICHECK_PPSTRUCTURE_LAYOUT_MODEL_DIR:-/models/paddlex/PP-DocLayout-L}
      AICHECK_PPSTRUCTURE_WIRED_TABLE_STRUCTURE_MODEL_DIR: ${AICHECK_PPSTRUCTURE_WIRED_TABLE_STRUCTURE_MODEL_DIR:-/models/paddlex/SLANeXt_wired}
      AICHECK_PPSTRUCTURE_WIRED_TABLE_CELLS_MODEL_DIR: ${AICHECK_PPSTRUCTURE_WIRED_TABLE_CELLS_MODEL_DIR:-/models/paddlex/RT-DETR-L_wired_table_cell_det}
      AICHECK_PPSTRUCTURE_WIRELESS_TABLE_STRUCTURE_MODEL_DIR: ${AICHECK_PPSTRUCTURE_WIRELESS_TABLE_STRUCTURE_MODEL_DIR:-/models/paddlex/SLANeXt_wireless}
      AICHECK_PPSTRUCTURE_WIRELESS_TABLE_CELLS_MODEL_DIR: ${AICHECK_PPSTRUCTURE_WIRELESS_TABLE_CELLS_MODEL_DIR:-/models/paddlex/RT-DETR-L_wireless_table_cell_det}
      AICHECK_ENABLE_OPENCV_TABLE_GRID: ${AICHECK_ENABLE_OPENCV_TABLE_GRID:-true}
      AICHECK_OPENCV_TABLE_GRID_MAX_CELLS: ${AICHECK_OPENCV_TABLE_GRID_MAX_CELLS:-1800}
      AICHECK_ENABLE_PADDLEX_SEAL_PIPELINE: ${AICHECK_ENABLE_PADDLEX_SEAL_PIPELINE:-true}
      AICHECK_SEAL_DET_MODEL_DIR: ${AICHECK_SEAL_DET_MODEL_DIR:-/models/paddlex/PP-OCRv4_server_seal_det}
      AICHECK_SEAL_REC_MODEL_DIR: ${AICHECK_SEAL_REC_MODEL_DIR:-/models/paddleocr/PP-OCRv4_server_rec}
      AICHECK_ENABLE_AGENTDESIGN_SEAL_OCR: ${AICHECK_ENABLE_AGENTDESIGN_SEAL_OCR:-false}
      AICHECK_AGENTDESIGN_SEAL_TIMEOUT: ${AICHECK_AGENTDESIGN_SEAL_TIMEOUT:-140}
      AICHECK_AGENTDESIGN_SEAL_MAX_CANDIDATES: ${AICHECK_AGENTDESIGN_SEAL_MAX_CANDIDATES:-6}
      AICHECK_AGENTDESIGN_SEAL_MAX_OCR_CANDIDATES: ${AICHECK_AGENTDESIGN_SEAL_MAX_OCR_CANDIDATES:-3}
      AICHECK_OCR_PREPROCESS_CACHE_DIR: ${AICHECK_OCR_PREPROCESS_CACHE_DIR:-/var/cache/aicheck-ocr/preprocess}
      AICHECK_OCR_DISABLE_VARIANT_CACHE: ${AICHECK_OCR_DISABLE_VARIANT_CACHE:-false}
      AICHECK_OCR_RESULT_CACHE_DIR: ${AICHECK_OCR_RESULT_CACHE_DIR:-/var/cache/aicheck-ocr/results}
      AICHECK_OCR_DISABLE_RESULT_CACHE: ${AICHECK_OCR_DISABLE_RESULT_CACHE:-false}
      AICHECK_OCR_ENGINE_RESULT_CACHE_DIR: ${AICHECK_OCR_ENGINE_RESULT_CACHE_DIR:-/var/cache/aicheck-ocr/engines}
      AICHECK_OCR_DISABLE_ENGINE_RESULT_CACHE: ${AICHECK_OCR_DISABLE_ENGINE_RESULT_CACHE:-false}
      AICHECK_TESSERACT_POLICY: ${AICHECK_TESSERACT_POLICY:-fallback_only}
      PADDLEOCR_VL_MODEL_DIR: ${PADDLEOCR_VL_MODEL_DIR:-/models/paddleocr-vl}
      AICHECK_ENABLE_PADDLEOCR_VL: ${AICHECK_ENABLE_PADDLEOCR_VL:-false}
      AICHECK_PADDLEOCR_VL_FORCE_SUBPROCESS: ${AICHECK_PADDLEOCR_VL_FORCE_SUBPROCESS:-true}
      AICHECK_PADDLEOCR_VL_TIMEOUT: ${AICHECK_PADDLEOCR_VL_TIMEOUT:-120}
      AICHECK_PADDLEOCR_VL_MEMORY_LIMIT_MB: ${AICHECK_PADDLEOCR_VL_MEMORY_LIMIT_MB:-8192}
      AICHECK_PADDLEOCR_VL_MIN_MEMORY_MB: ${AICHECK_PADDLEOCR_VL_MIN_MEMORY_MB:-10240}
      DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/models/docling}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_PDX_MODEL_SOURCE: local
    ports:
      - "127.0.0.1:8010:8010"
    mem_limit: ${AICHECK_OCR_CONTAINER_MEMORY_LIMIT:-10g}
    mem_reservation: ${AICHECK_OCR_CONTAINER_MEMORY_RESERVATION:-4g}
    volumes:
      - ${AICHECK_AGENTDESIGN_HOST_PATH:-./apps/ocr_service}:/opt/agentdesign:ro
      - ${AICHECK_OCR_MODELS_HOST_PATH:?AICHECK_OCR_MODELS_HOST_PATH is required}:/models:ro
      - ocr-cache:/var/cache/aicheck-ocr
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AICHECK_MINIO_ACCESS_KEY:-aicheck}
      MINIO_ROOT_PASSWORD: ${AICHECK_MINIO_SECRET_KEY:?AICHECK_MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: ${AICHECK_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AICHECK_POSTGRES_DB:-aicheck}
      POSTGRES_USER: ${AICHECK_POSTGRES_USER:-aicheck}
      POSTGRES_PASSWORD: ${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}
      LITELLM_POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      WORKFLOW_POSTGRES_DB: ${WORKFLOW_POSTGRES_DB:-workflow}
    ports:
      - "127.0.0.1:${AICHECK_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-service:
    image: temporalio/auto-setup:1.26.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${AICHECK_POSTGRES_USER:-aicheck}
      POSTGRES_PWD: ${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address \"$$(hostname -i):7233\" cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 24

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal-service:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:4000,http://127.0.0.1:4000
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      temporal-service:
        condition: service_healthy

  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile.embedding
      args:
        AICHECK_PIP_INDEX_URL: ${AICHECK_PIP_INDEX_URL:-}
    command: uvicorn apps.embedding_service.main:app --host 0.0.0.0 --port 7997
    restart: unless-stopped
    environment:
      DO_NOT_TRACK: "1"
      HF_HOME: /app/.cache
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      TRANSFORMERS_CACHE: /app/.cache
      INFINITY_API_KEY: ${INFINITY_API_KEY:?INFINITY_API_KEY is required}
      AICHECK_EMBEDDING_MODEL_ID: ${AICHECK_LOCAL_EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      AICHECK_EMBEDDING_SERVED_MODEL_NAME: ${AICHECK_LOCAL_EMBEDDING_SERVED_MODEL_NAME:-embedding-default}
      AICHECK_EMBEDDING_ENGINE: ${AICHECK_LOCAL_EMBEDDING_ENGINE:-torch}
      AICHECK_EMBEDDING_DEVICE: ${AICHECK_EMBEDDING_DEVICE:-cpu}
      AICHECK_EMBEDDING_NORMALIZE: ${AICHECK_EMBEDDING_NORMALIZE:-true}
      AICHECK_EMBEDDING_PRELOAD: ${AICHECK_EMBEDDING_PRELOAD:-false}
    ports:
      - "127.0.0.1:7997:7997"
    volumes:
      - ${AICHECK_EMBEDDING_CACHE_HOST_PATH:-/tmp/aicheck-embedding-cache}:/app/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 1800s

  litellm-service:
    image: ${AICHECK_LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.84.3@sha256:67c31510b20e60e8eb1670b9c47714c1c519cb04f5e5c077cf1f12073bf8fb30}
    restart: unless-stopped
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${LITELLM_POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      INFINITY_API_KEY: ${INFINITY_API_KEY:?INFINITY_API_KEY is required}
      AICHECK_LITELLM_STRICT_PROVIDER_HEALTH: ${AICHECK_LITELLM_STRICT_PROVIDER_HEALTH:-true}
      NO_PROXY: ${AICHECK_LITELLM_NO_PROXY:-127.0.0.1,localhost,::1,postgres,embedding-service}
      no_proxy: ${AICHECK_LITELLM_NO_PROXY:-127.0.0.1,localhost,::1,postgres,embedding-service}
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, os, sys, urllib.request; headers={'Authorization': 'Bearer ' + os.environ['LITELLM_MASTER_KEY']}; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:4000/health/readiness', headers=headers), timeout=3).read(); strict=os.getenv('AICHECK_LITELLM_STRICT_PROVIDER_HEALTH','true').lower()=='true'; data={} if not strict else json.loads(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:4000/health', headers=headers), timeout=3).read() or b'{}'); unhealthy_count=int(data.get('unhealthy_count') or 0); sys.exit(1 if strict and unhealthy_count else 0)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
  ocr-cache:
  postgres-data:

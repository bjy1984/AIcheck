[unix_http_server]
file=/usrdata/aicheck-document-ai/state/supervisor.sock
chmod=0700

[supervisord]
logfile=/usrdata/aicheck-document-ai/logs/supervisord.log
pidfile=/usrdata/aicheck-document-ai/state/supervisord.pid
childlogdir=/usrdata/aicheck-document-ai/logs
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///usrdata/aicheck-document-ai/state/supervisor.sock

[program:paddle-vl16]
user=aicheck-docai
command=/usrdata/aicheck-document-ai/venv-paddle-vl16/bin/uvicorn paddle_service:app --host 127.0.0.1 --port 18110
directory=/usrdata/aicheck-document-ai/services
environment=HOME="/usrdata/aicheck-document-ai",XDG_CACHE_HOME="/usrdata/aicheck-cache/document-ai",PADDLE_PDX_CACHE_HOME="/usrdata/aicheck-cache/document-ai/paddlex",CUDA_VISIBLE_DEVICES="0",DOCUMENT_AI_API_KEY="%(ENV_DOCUMENT_AI_API_KEY)s",PADDLE_VL_MODEL_PATH="/usrdata/aicheck-models/document-ai/paddleocr-vl16/66317acc4c9fc17bd154591ce650735cd2855f3e",PADDLE_AUX_MODEL_ROOT="/usrdata/aicheck-models/paddlex/official_models",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",HF_HOME="/usrdata/aicheck-cache/document-ai/hf"
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/usrdata/aicheck-document-ai/logs/paddle-vl16.log
stderr_logfile=/usrdata/aicheck-document-ai/logs/paddle-vl16.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:nuextract3]
user=aicheck-docai
command=/usrdata/aicheck-document-ai/venv-nuextract3/bin/uvicorn nuextract_service:app --host 127.0.0.1 --port 18220
directory=/usrdata/aicheck-document-ai/services
environment=HOME="/usrdata/aicheck-document-ai",XDG_CACHE_HOME="/usrdata/aicheck-cache/document-ai",TORCH_HOME="/usrdata/aicheck-cache/document-ai/torch",CUDA_VISIBLE_DEVICES="0",DOCUMENT_AI_API_KEY="%(ENV_DOCUMENT_AI_API_KEY)s",NUEXTRACT_MODEL_PATH="/usrdata/aicheck-models/document-ai/nuextract3/2e9fca82ee641e6bb6e1f5d905241e994be27a07",NUEXTRACT_MAX_PAGES="6",NUEXTRACT_MAX_NEW_TOKENS="2048",NUEXTRACT_REQUEST_TIMEOUT_SECONDS="180",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",HF_HOME="/usrdata/aicheck-cache/document-ai/hf"
autostart=true
autorestart=true
startsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/usrdata/aicheck-document-ai/logs/nuextract3.log
stderr_logfile=/usrdata/aicheck-document-ai/logs/nuextract3.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:document-ai-shadow]
user=aicheck-docai
command=/usrdata/aicheck-document-ai/venv-control/bin/uvicorn hybrid_service:app --host 127.0.0.1 --port 18300
directory=/usrdata/aicheck-document-ai/services
environment=HOME="/usrdata/aicheck-document-ai",XDG_CACHE_HOME="/usrdata/aicheck-cache/document-ai",DOCUMENT_AI_API_KEY="%(ENV_DOCUMENT_AI_API_KEY)s",PADDLE_URL="http://127.0.0.1:18110",NUEXTRACT_URL="http://127.0.0.1:18220",DOCUMENT_AI_UPLOAD_ROOT="/usrdata/aicheck-cache/document-ai/uploads"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/usrdata/aicheck-document-ai/logs/document-ai-shadow.log
stderr_logfile=/usrdata/aicheck-document-ai/logs/document-ai-shadow.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_backups=5

services:
  api-service:
    environment:
      AICHECK_OCR_PROVIDER_MODE: official
      AICHECK_OCR_PIPELINE_MODE: active
      AICHECK_OCR_MAX_LONG_SIDE: "1920"
      AICHECK_ALIYUN_OCR_MAX_PAGES_PER_BATCH: "10"
      AICHECK_ALIYUN_OCR_MAX_DOCUMENT_PAGES: "200"
      AICHECK_ALIYUN_OCR_MAX_COST_CNY_PER_DOCUMENT: "5"
      AICHECK_OCR_ALLOW_LOCAL_HEAVY_FALLBACK: "false"
      AICHECK_OCR_ALLOW_SILENT_PROVIDER_FALLBACK: "false"
      AICHECK_OCR_DISTRIBUTED_CONTROL: "true"
      AICHECK_OCR_GLOBAL_CALL_CONCURRENCY: "4"
      AICHECK_OCR_GLOBAL_DOCUMENT_CONCURRENCY: "2"
      AICHECK_OCR_STRUCTURED_PAGE_LIMIT: "6"
      AICHECK_OCR_SEAL_ROI_LIMIT_PER_DOCUMENT: "6"
      AICHECK_OCR_FORMAL_READINESS_PROFILE_ALLOWLIST: ${AICHECK_OCR_FORMAL_READINESS_PROFILE_ALLOWLIST:-}

  worker-service:
    environment: &official-ocr-environment
      AICHECK_OCR_PROVIDER_MODE: official
      AICHECK_OCR_PIPELINE_MODE: active

  cpu-heavy-worker-service:
    environment:
      <<: *official-ocr-environment

  ocr-local-worker-service:
    environment:
      <<: *official-ocr-environment

  ocr-remote-worker-service:
    environment:
      <<: *official-ocr-environment

  llm-remote-worker-service:
    environment:
      <<: *official-ocr-environment

  ocr-service:
    profiles:
      - local-ocr

[project]
name = "aicheck-backend"
version = "0.1.0"
description = "AIcheck FastAPI backend, worker, OCR service, and LiteLLM gateway integration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.0",
  "PyJWT[crypto]>=2.10.1,<3.0",
  "passlib[bcrypt]>=1.7.4",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "minio>=7.2.0",
  "httpx>=0.27.0",
  # 落库前要把整份状态序列化去比对基线，标准库 json 实测 18 秒（orjson 2.6 秒）。
  # 这段时间占着解释器，同进程的所有请求都被挤住——一次写入拖慢全站。
  # 原先是靠间接依赖拿到的，随时可能消失，所以显式声明。
  "orjson>=3.10.0",
  "PyYAML>=6.0.0",
  "Pillow>=10.4.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# B008「不要在参数默认值里调用函数」对 FastAPI 是误报：Body()/File()/Query()/
# Depends() 写在默认值里是框架文档规定的写法，框架自己在请求期解析它们，
# 不存在「可变默认值被复用」的那个经典陷阱。
#
# 全仓 151 条 B008 全部来自 Body(149) 和 File(2)。这是配置缺失，不是代码问题——
# 照规则去改反而会写出偏离框架惯例的代码。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
    "Body",
    "Depends",
    "File",
    "Form",
    "Header",
    "Path",
    "Query",
    "Security",
]

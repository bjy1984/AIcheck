services:
  workflow-migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: python scripts/setup_langgraph_checkpoint.py
    environment:
      AICHECK_REVIEW_ORCHESTRATION: ${AICHECK_REVIEW_ORCHESTRATION:-temporal}
      AICHECK_LANGGRAPH_CHECKPOINT_DISABLE: ${AICHECK_LANGGRAPH_CHECKPOINT_DISABLE:-false}
      LANGGRAPH_CHECKPOINT_DSN: postgresql://${AICHECK_POSTGRES_USER:-aicheck}:${AICHECK_POSTGRES_PASSWORD:?AICHECK_POSTGRES_PASSWORD is required}@postgres:5432/${WORKFLOW_POSTGRES_DB:-workflow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-service:
    depends_on:
      workflow-migrate:
        condition: service_completed_successfully

  review-worker-service:
    depends_on:
      workflow-migrate:
        condition: service_completed_successfully

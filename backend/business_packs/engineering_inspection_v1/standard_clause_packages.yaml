          sourceClause: GB/T 20801.1-2025 6.7.5.5——位移应力范围应满足许用位移应力范围的限制条件
          verifiedBy: null
        - code: stress_range_factor_derived_from_cycles
          actualPath: result.stressRangeFactorDerivedFromCycles
          operator: equals
          expected: true
          standardRef: STD-GBT-20801.1-2025
          sourceClause: GB/T 20801.1-2025 6.7.5.5——位移应力范围系数 f 应按公式(36)由当量循环次数 N 计算或由图 13 查取，且不超过最大值 fm
          verifiedBy: null
        - code: fatigue_analysis_above_one_million_cycles

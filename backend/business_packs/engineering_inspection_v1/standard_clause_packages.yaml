      - 跨接电阻 0.03Ω 与对地电阻 100Ω／1000Ω 是条文明列数值；测点数量、测试仪器精度与测试方法标准未核到原文，故不判
      - 7.7.13.2 允许"设计另有规定"，工具按 measurement.designDefaultLimitApplies 分支；设计另有规定时 100Ω 判据不适用，此时应由人工按设计值复核
      - G.9 其余条（屏蔽保护、非导体管段跨接线规格）未纳入判据
    domains:

      - 公式(33)(36)(37)的数值不在工具内复算，只判报告是否声明已按该方法评定；位移应力范围、应力范围系数 f 与当量循环次数 N 的具体数值需人工复核
      - 8.6.1.7 a)（环向纵向螺旋焊缝 100% RT/UT、其余焊接接头 100% MT/PT）与 c)（敏感性泄漏试验合格）分别由 R35／R36 与 R64／R67 判定，这里只核"三项是否同时满足"这一声明，不重复判定各项本身
      - parameters_match_design_document 是对 8.6.1.7 b)"按第 6 章的有关规定"的工程转述，非条文逐字；一致性按报告与设计文件的录入值比对，不代算
    domains:

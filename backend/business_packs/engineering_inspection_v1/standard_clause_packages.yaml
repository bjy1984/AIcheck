          actualPath: result.fatigueAnalysisPerformed
          operator: equals
          expected: true
          standardRef: STD-GBT-20801.1-2025
          sourceClause: GB/T 20801.1-2025 6.7.5.5 注——当量循环次数 N 大于 10^6 时公式(36)与图 13 不适用，应按附录 Q 或其他相应规范进行疲劳分析
          verifiedBy: null
        - code: expansion_joint_designed_separately
          applicabilityPath: design.expansionJointPresent
          actualPath: result.expansionJointDesignedSeparately
          operator: equals
          expected: true
          standardRef: STD-GBT-20801.1-2025
          sourceClause: GB/T 20801.1-2025 6.7.5.5 注——公式(36)或图 13 不适用于膨胀节本体的设计
          verifiedBy: null
        - code: properties_from_cycle_temperature_extremes
          actualPath: parameters.propertiesFromCycleExtremes
          operator: equals
          expected: true
          standardRef: STD-GBT-20801.1-2025
          sourceClause: GB/T 20801.1-2025 6.7.5.5.4 a)——计算应力范围时应根据材料在温度循环中最高和最低工作温度下从表 C.1 查取线膨胀系数
          verifiedBy: null
        - code: parameters_match_design_document
          actualPath: parameters.matchDesignDocument
          operator: equals
          expected: true
          standardRef: STD-GBT-20801.1-2025
          sourceClause: GB/T 20801.1-2025 8.6.1.7 b)——柔性分析应按第 6 章的有关规定进行，即分析所用设计参数应与设计文件一致（工程转述，非条文逐字）

    工作见证： 返修申请单、返修工艺、返修审手续（同一部位返修次数通常不得超过2次，超过需制定专项方案并经技术负责人批准）、返修后检测报告（如RT/UT）。
  agentThinking: |-
    找到返修申请单、返修工艺、返修审批手续、返修记录和返修后检测报告。先识别返修焊缝编号、缺陷类型、返修次数和返修部位；判断返修工艺是否经批准并与缺陷类型匹配；再判断同一部位返修次数是否超过 2 次，超过 2 次时必须有专项方案并经技术负责人批准；最后确认返修后检测合格并闭环。

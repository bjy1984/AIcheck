  criteria: |-
    标准规范： 《特种设备焊接操作人员考核细则》(TSG Z6002-2010) 。监检人员需现场核对人证是否相符，且作业内容（序号29）在证书允许范围内，例：某焊工所焊接的管线材质20钢，规格为89×4.5mm，焊接方法是氩弧焊，焊工证号是GTAW-FeII-6G-3/57-FefS-02/11/12，查TSG Z6002-2010，焊接方法氩弧焊代号GTAW，金属材料类别FeII能覆盖20；焊接位置6G，全位置焊，能覆盖；3/57代号可焊管线壁厚0-6mm，管径25-不限，能覆盖89×4.5mm，即通过。
  standardText: |-

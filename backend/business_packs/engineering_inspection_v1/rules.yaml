    标准规范：TSG Z8001-2019《特种设备无损检测人员考核规则》及第1号修改单、NB/T 47013.1-2015《承压设备无损检测 第1部分：通用要求》、NB/T 47013.2-2015《承压设备无损检测 第2部分：射线检测》、NB/T 47013.3-2023《承压设备无损检测 第3部分：超声检测》等。
  checkMethod: |-
    工作见证：需提供无损检测人员明细表、无损检测人员资格证和执业注册证，必要时提供无损检测人员劳动合同证明文件。
  witnessText: |-
    工作见证：需提供无损检测人员明细表、无损检测人员资格证和执业注册证，必要时提供无损检测人员劳动合同证明文件。
  sourceWitness: |-
    工作见证：需提供无损检测人员明细表、无损检测人员资格证和执业注册证，必要时提供无损检测人员劳动合同证明文件。
  agentThinking: |-
    找到无损检测人员明细表、资格证、执业注册证和必要的劳动合同证明。抽取人员姓名、证书编号、检测方法、级别、有效期和注册单位；再找到实际检测记录或报告中的检测人员。判断人员证书是否有效、注册单位是否匹配、持证项目是否覆盖实际检测方法和级别，必要时判断劳动关系或项目任命是否支撑人员参与。
  toolchainThinking: |-
    调用 T01、T02 定位人员明细、资格证、执业注册证、劳动合同和检测报告；调用 T03、T04 抽取人员、证书项目、有效期和注册单位；调用 T05 核验证书和注册关系；调用 T07 判断持证项目覆盖；调用 T08 比对证书人员与报告签字人员；调用 T11 标记证书过期、项目不覆盖或单位不一致；调用 T12 输出结论。

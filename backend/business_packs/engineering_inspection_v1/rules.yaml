  standardText: |-
    TSG07-2019特种设备生产和充装单位许可规则

    国家市场监督管理总局公 告

    2021 年第41 号《市场监管总局关于特种设备行政许可有关事项的公告》

    二者不一致的以后者为准
  checkMethod: |-
    核查设计许可证的机构名称是否与施工图纸标题栏和设计印章一致

    核查设计许可证的范围根据设计文件中的施工说明、管道特性表，动力管道（GCD），在范围处一定要有GCD管道资质，GC2级别管道要有GC2或者GC1的资质，GC1级别管道要有GC1的资质

    有效期：是否能覆盖住施工期间，因为施工期间也要有技术变更澄清事宜。

    Agent思考方式：找到设计许可证的机构名称，找到施工图纸的标题栏内容，找到施工图纸的设计印章内容，比较三处的机构名称；找到设计许可证的范围，找到设计文件中的施工说明、管道特性表，动力管道（GCD）的施工范围，gcd管道资质要对应，对应的规则是：GC2级别管道要有GC2或者GC1的资质，GC1级别管道要有GC1的资质。
  witnessText: |-
    核查设计许可证的机构名称是否与施工图纸标题栏和设计印章一致

    核查设计许可证的范围根据设计文件中的施工说明、管道特性表，动力管道（GCD），在范围处一定要有GCD管道资质，GC2级别管道要有GC2或者GC1的资质，GC1级别管道要有GC1的资质

    有效期：是否能覆盖住施工期间，因为施工期间也要有技术变更澄清事宜。

    Agent思考方式：找到设计许可证的机构名称，找到施工图纸的标题栏内容，找到施工图纸的设计印章内容，比较三处的机构名称；找到设计许可证的范围，找到设计文件中的施工说明、管道特性表，动力管道（GCD）的施工范围，gcd管道资质要对应，对应的规则是：GC2级别管道要有GC2或者GC1的资质，GC1级别管道要有GC1的资质。
  sourceWitness: ""
  agentThinking: |-
    找到设计许可证的机构名称、许可证范围和有效期；找到施工图纸标题栏的设计单位名称、设计印章上的单位名称；找到设计说明和管道特性表中的管道类别、级别和施工期间。先比较三处机构名称是否一致，再按管道级别判断许可证范围：GCD 管道应有 GCD 资质，GC2 级管道应有 GC2 或 GC1 资质，GC1 级管道应有 GC1 资质；最后判断有效期是否覆盖施工及设计变更澄清期间。若名称不一致、范围不覆盖或有效期不足，输出不符合或需人工确认。
  toolchainThinking: |-
    先调用 T01、T02 定位当前规则和设计许可证、施工图、设计说明、管道特性表；调用 T03、T04 抽取机构名称、印章文字、资质范围、有效期、管道等级；调用 T05、T07、T08 做证照范围覆盖和跨文件名称一致性判断；调用 T11 生成缺项或联络单；调用 T12 回写证据链和审查意见。

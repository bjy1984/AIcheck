      inspectionItem: 射线检测底片抽查
      inspectionClass: B
      standardText: |-
        标准规范：NB/T 47013.1-2015《承压设备无损检测 第1部分：通用要求》、NB/T 47013.2-2015《承压设备无损检测 第2部分：射线检测》、NB/T 47013.11-2023《承压设备无损检测 第11部分：射线数字成像检测》等。
      witnessText: |-
        工作见证：需提供相关所有射线检测底片。
      agentThinking: |-
        找到所有射线检测底片及其对应报告，建立底片编号、焊缝编号、检测日期、评定结论和报告编号的对应关系。按抽查策略选择样本，依据 NB/T 47013.2 或 NB/T 47013.11 检查底片标识、像质计或灵敏度、黑度、几何不清晰度、缺陷显示和评定结论是否与报告一致。底片无法打开、编号不对应、质量指标缺失或底片显示与报告结论不一致时，进入人工复核。
      toolchainThinking: |-
        调用 T01、T02 定位底片库和射线检测报告；调用 T03、T04 抽取底片编号、焊缝编号和报告信息；调用 T09 辅助识别底片质量和标识；调用 T10 生成抽查样本和覆盖统计；调用 T08 比对底片与报告对应关系；调用 T11 触发底片异常人工复核；调用 T12 输出抽查结论。
    requiredEvidence:
    - 找到所有射线检测底片及其对应报告
    - 、焊缝编号、检测日期、评定结论和报告
    - 清晰度、缺陷显示和评定结论是否与报告
    - 不对应、质量指标缺失或底片显示与报告
    - 定位底片库和射线检测报告
    - 抽取底片编号、焊缝编号和报告
    - 比对底片与报告

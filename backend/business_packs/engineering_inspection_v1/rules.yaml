      standardText: |-
        标准规范：NB/T 47013.1-2015《承压设备无损检测 第1部分：通用要求》、NB/T 47013.2-2015《承压设备无损检测 第2部分：射线检测》、NB/T 47013.11-2023《承压设备无损检测 第11部分：射线数字成像检测》等。
      witnessText: |-
        工作见证：需提供射线检测现场抽查的底片、记录和报告；委托无损检测单位进行的需提供委托检测合同、射线检测委托单。
      agentThinking: |-
        找到射线检测现场抽查底片、现场监检记录、现场照片、报告、委托检测合同和射线检测委托单。先判断该检测是否委托外部机构，若委托则核查合同和委托单是否覆盖现场抽查内容；再核查现场记录、底片和报告是否能互相对应，检测方法、人员、设备和结论是否满足标准。现场抽查应要求监检人员上传现场记录和必要照片。
      toolchainThinking: |-
        调用 T01、T02 定位现场抽查资料、合同、委托单、底片和报告；调用 T03、T04 抽取合同范围、委托内容、检测编号、人员和结论；调用 T09 辅助核查底片或现场照片；调用 T10 校验抽查样本；调用 T08 串联合同、委托、记录、底片、报告；调用 T11 处理委托缺失或证据断链；调用 T12 回写结论。

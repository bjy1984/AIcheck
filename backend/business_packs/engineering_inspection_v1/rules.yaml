      Agent思考方式：找到管道布管、连接方式、穿跨越检查试验记录、组对实测数据、设备安装定位记录、连接顺序记录和现场照片。抽取管线编号、连接方式、接口端面空隙、偏斜、错口、不同轴情况、处理方式、设备地脚螺栓紧固状态、与设备连接顺序和检查结论。判断是否存在强力对口、加热管子、加偏垫或多层垫等禁止方式，不能只靠照片判断，应以记录、实测数据、现场照片和监检人员确认共同判断。
      工具集调用思考：调用 T01、T02 定位布管连接记录、穿跨越记录、设计文件和现场照片；调用 T03、T04 抽取连接方式、接口状态、检查结论和设备连接信息；调用 T06、T07 判断禁止行为和连接条件；调用 T09 辅助识别现场异常；调用 T08 比对记录与设计/现场证据；调用 T11 标记违规连接或证据不足；调用 T12 回写结论。

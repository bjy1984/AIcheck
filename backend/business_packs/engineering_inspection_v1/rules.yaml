    acceptanceCriteria: []
    humanConfirmation:
    - 证据缺失、范围不覆盖或跨文件不一致时生成补充资料项或联络单。
    promptContext: |-
      监检项目：防腐及保温材料质量证明文件
      类别：C
      判断准则/标准规范：标准规范：设计文件要求、TSG D7006-2020《压力管道监督检验规则》、TSG 0-2019《特种设备生产和充装单位许可规则》。
      方法及内容/工作见证：工作见证：防腐漆或其他特殊防腐材料的质量证明文件；工厂化预制的防腐管道元件需提供出厂质量证明文件，必要时提供型式试验证书、压力管道元件制造许可、制造监督检验证书。

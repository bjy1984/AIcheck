      工具集调用思考：调用 T01、T02 定位材料质量证明、型式试验、制造许可、监检证明和设计文件；调用 T03、T04 抽取材料型号、批号、生产单位和证明范围；调用 T05 核验许可和证明文件；调用 T06 查询监管规则；调用 T08 比对证明文件、设计要求和实物/清单；调用 T11 标记缺证或不覆盖；调用 T12 回写结论。

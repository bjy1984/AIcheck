  - T04
  - T06
  - T07
  - T08
  - T11
  - T12
  criteria: |-
    标准规范：热处理曲线需完整无中断，硬度值应符合设计说明或GB/T20801.1-2025第7.6.6条要求，一般碳钢布氏硬度≤200HB、合金钢≤225HB。
  standardText: |-
    标准规范：热处理曲线需完整无中断，硬度值应符合设计说明或GB/T20801.1-2025第7.6.6条要求，一般碳钢布氏硬度≤200HB、合金钢≤225HB。
  checkMethod: |-
    工作见证： 自动记录的温度-时间曲线图、热处理报告、硬度测试报告（布氏/洛氏/维氏）。
  witnessText: |-
    工作见证： 自动记录的温度-时间曲线图、热处理报告、硬度测试报告（布氏/洛氏/维氏）。
  sourceWitness: |-
    工作见证： 自动记录的温度-时间曲线图、热处理报告、硬度测试报告（布氏/洛氏/维氏）。
  agentThinking: |-
    找到自动记录的温度-时间曲线、热处理报告、硬度检测报告和对应工艺卡。通过 T03/T04 抽取曲线时间-温度点、升温段、保温段和降温段，判断曲线是否连续无中断，保温温度、保温时间、升温速率和降温速率是否满足工艺卡；抽取硬度检测值并按材质类型判断是否满足设计说明或 GB/T20801.1-2025 第 7.6.6 条，一般碳钢布氏硬度不大于 200HB、合金钢不大于 225HB。若曲线断点、参数偏离或硬度超限，标记为异常。

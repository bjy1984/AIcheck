      工具集调用思考：调用 T01、T02 定位工艺文件、操作指导书、检测方案和设计要求；调用 T03、T04 抽取检测参数、适用对象和验收等级；调用 T06 查询对应检测方法标准；调用 T07 判断参数和适用范围；调用 T08 比对工艺文件与方案、记录一致性；调用 T11 标记工艺缺失或不覆盖；调用 T12 输出审查意见。

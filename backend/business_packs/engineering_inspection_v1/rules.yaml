      判断准则/标准规范：标准规范： 设计说明、 GB/T20801.1-2025第7.4.4.3条、GB 50236《现场设备、工业管道焊接工程施工规范》。监检时可抽查实物，或现场拍照上传，确保组对质量满足工艺要求，避免强行组对。
      方法及内容/工作见证：工作见证： 管道组对检查记录表，包含错边量、间隙、坡口角度等实测数据。
      Agent思考方式：找到管道组对检查记录，抽取焊口编号、错边量、间隙、坡口角度、组对日期和检查结论；找到设计说明或工艺文件中的组对要求；如有现场照片或实物抽查数据，同时识别是否存在强行组对迹象。将实测数据与工艺要求逐项比较，超过允许值或记录与照片不一致时标记为异常。
      工具集调用思考：调用 T01、T02 定位组对记录、工艺文件和现场照片；调用 T03、T04 抽取组对实测数据；调用 T06、T07 获取并应用组对允许值；调用 T09 解析照片或实测证据；调用 T08 比对记录、工艺和现场证据；调用 T11 处理超差或证据不足；调用 T12 输出审查意见。

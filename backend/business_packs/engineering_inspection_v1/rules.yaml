    - 找到耐压试验方案、设计文件、现场记录
    - 、压力表读数照片或视频
    - 、现场检查表和监检人员确认记录
    - 过程中是否有泄漏、压降或异常处置记录
    - 定位方案、设计文件、现场记录
    - 比对方案、记录
    extractionTargets:
    - 压力
    - 保压时间
    - 温度
    - 人员
    - 时间
    - 结论
    verificationSteps:
    - 现场检查耐压试验压力、保压时间及结果（如液压试验时，试验压力为设计压力的1.5倍（不考虑温度系数），保压时间不应少于10min
    acceptanceCriteria:
    - 现场检查耐压试验压力、保压时间及结果（如液压试验时，试验压力为设计压力的1.5倍（不考虑温度系数），保压时间不应少于10min
    - 气压试验时，试验压力不低于设计压力的1.1倍等）
    humanConfirmation:
    - A 类监检项目发布或审查结论需人工确认。
    - 涉及现场检查、抽查或影像证据时，AI 只做辅助核验，需监检人员确认现场事实。
    promptContext: |-
      监检项目：耐压试验压力、保压时间及结果
      类别：A
      判断准则/标准规范：GB/T20801.1-2025第8部分

      TSG31-2025第3、4部分

      GB50235-2010第8部分

      设计文件
      方法及内容/工作见证：现场检查耐压试验压力、保压时间及结果（如液压试验时，试验压力为设计压力的1.5倍（不考虑温度系数），保压时间不应少于10min；气压试验时，试验压力不低于设计压力的1.1倍等）
      Agent思考方式：找到耐压试验方案、设计文件、现场记录、压力表读数照片或视频、现场检查表和监检人员确认记录。抽取试验类型、设计压力、实际试验压力、升压过程、保压开始和结束时间、保压时长、检查结果和结论。根据液压或气压试验类型计算最低试验压力，判断保压时间是否满足要求，试验过程中是否有泄漏、压降或异常处置记录；Agent 可生成现场检查表和资料录入项供监检人员补充。
      工具集调用思考：调用 T01、T02 定位方案、设计文件、现场记录和影像资料；调用 T03、T04 抽取压力、时间、试验类型和结果；调用 T06、T07 计算液压 1.5 倍或气压 1.1 倍等判据并判断保压时间；调用 T09 辅助识别现场压力读数；调用 T08 比对方案、记录和现场证据；调用 T11 对 A 类异常触发人工确认；调用 T12 回写结论。

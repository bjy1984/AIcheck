      方法及内容/工作见证：抽查管道结构、焊缝布置施工检查记录或现场抽查是否符合相关标准及设计要求（如管道穿越墙、道路时应设套管保护，套管内的管段不宜有环焊缝存在，如有应进行100%无损检测等）
      Agent思考方式：找到穿跨越工程的设计文件、管道结构和焊缝布置施工检查记录，必要时找到现场照片或抽查记录。识别穿越墙、道路、套管内管段、环焊缝位置和无损检测要求。现场照片只作为辅助证据，必须与设计图、施工记录、焊缝布置记录、套管位置和无损检测报告交叉核验。判断是否按设计设置套管保护，套管内是否存在环焊缝；若存在环焊缝，继续检查是否进行了 100% 无损检测。
      工具集调用思考：调用 T01、T02 定位设计文件、施工检查记录、现场照片和无损检测报告；调用 T03、T04 抽取穿跨越位置、套管、焊缝编号和检测要求；调用 T06、T07 查询并执行穿跨越和检测判据；调用 T09 辅助核查现场照片；调用 T08 比对设计、记录和检测报告；调用 T11 处理套管或检测缺项；调用 T12 输出结论。

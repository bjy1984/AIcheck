  sourceSequence: 34
  businessModule: 二、热处理部分
  inspectionCategory: 二、热处理部分
  inspectionItem: 热处理记录、报告曲线、硬度检测报告
  materialTypeCodes:
  - generic_review_material
  - heat_treatment_record
  - instrument_calibration_certificate
  thinkingModeIds:
  - M07
  - M10

# 把 OCR 解析出的真實表格認出來，並把表頭對映成判據讀的欄位路徑。
#
# 為什麼需要這份檔：fact builder 按 businessSchema 名字取表，判據按 actualPath
# 取值，但 2026-09-10 的盤點發現 OCR 分類器產生的 schema 名與 fact builder 要的
# 73 個名字交集為零，而 465 個判據欄位路徑全倉沒有任何地方產生。缺的不是配置，
# 是產生配置的機制——這份檔是機制的宣告面。
#
# 規矩（與凍結判據一致）：
# - 對映不上的欄位就**不寫**，不猜。判據看到缺項會報缺證據，那是正確的結果；
#   編一個值進去才是災難。
# - 每條簽名都要寫 evidence，說明表頭是從哪份真實資料抽出來的。憑印象寫的簽名
#   會在真實素材上默默配錯表。
schemaVersion: table-schema-signatures-v1
signatures:
- businessSchema: material_certificate_domains
  domain: materialCertificate
  objectType: material_certificate
  sourceRuleIds: [R43]
  evidence: >-
    生產庫 ocr_parse_results 真實表頭（2026-09-10 抽出）：产品质量证明书编号 |
    元件名称 | 制造许可证编号 | 厂家 | 型式试验证书编号 | 序号 | 材质/标准 |
    规格/炉批号，7 列，出自廣東 LNG 支線改造的材料質量證明文件匯總表。
  match:
    required: [产品质量证明书编号]
    any: [元件名称, 材质/标准, 规格/炉批号, 制造许可证编号, 厂家, 型式试验证书编号]
    minAny: 2
  objectIdColumns: [产品质量证明书编号]
  # 表存在即代表這批材料交了質量證明文件，R43 的文件審查因此適用。
  # 這是一個**宣告的判斷**，不是從資料讀出來的；寫在這裡是為了可被覆核。
  applicableWhen: table_present
  fields:
  - path: certificate.documentNo
    columns: [产品质量证明书编号, 质量证明书编号, 产品质量证明书编号]
    parse: text
  - path: certificate.materialGrade
    # 真實值形如「材质:S30408标准:GB/T14976-2025」，要按標籤切出材質，
    # 整串塞進去會讓 materialGrade 混進標準號。
    columns: [材质/标准, 材质, 材料牌号]
    parse: labelled
    label: 材质
    stopLabels: [标准, 標準]

# 以下兩條是掃描件上的固定表格：OCR 只給片段、不給表，由 libs/ocr/form_tables.py
# 按 form 宣告的表名與表頭錨點重建（沒有 match：這類表不會以 OCR 表格的形式出現）。
# 只對映表上逐字寫明、判據直接讀的欄位；接地位置、吹洗方法、是否適用等表上沒寫的，
# 一律不寫，也不宣告 applicableWhen——適用性由設計資料決定，不從記錄表推。
- businessSchema: static_grounding_domains
  domain: staticGrounding
  objectType: pipeline
  sourceRuleIds: [R47]
  evidence: >-
    七項目快照（2026-09-23）恒基達鑫一二期裝車站交工資料 20260623104730.pdf 第 16 頁
    「表A.0.10管道静电接地测试记录」掃描件，macOS Vision 片段逐字：管线号 | 接头型式 |
    （法兰或螺拴接头）跨线接头 规格 材质 电阻值 | （系统接地）接地线 规格 材质 对地电阻值；
    兩條管線 PL8303-100、PL8306-100。
  form:
    title: 'A\.?0\.10管道静电接地测试记录'
    rowKey: 管线号
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    columns:
    - {name: 管线号, label: 管线号}
    - {name: 接头型式, label: 接头型式}
    - {name: 跨线接头规格, label: 规格, occurrence: 1}
    - {name: 跨线接头材质, label: 材质, occurrence: 1}
    - {name: 跨线接头电阻值, label: 电阻值}
    - {name: 接地线规格, label: 规格, occurrence: 2}
    - {name: 接地线材质, label: 材质, occurrence: 2}
    - {name: 对地电阻值, label: 对地电阻值}
  objectIdColumns: [管线号]
  fields:
  - path: installation.connectionMethod
    columns: [接头型式]
    parse: text
  # 每條管線一列、一個跨接電阻值；這一列的最大值就是它本身。
  - path: measurement.maxJointBondingResistanceOhm
    columns: [跨线接头电阻值]
    parse: number
    units: [Ω, ohm]
  - path: measurement.groundResistanceOhm
    columns: [对地电阻值]
    parse: number
    units: [Ω, ohm]
- businessSchema: blowing_cleaning_domains
  domain: blowingCleaning
  objectType: pipeline
  sourceRuleIds: [R68]
  evidence: >-
    同一份交工資料第 18 頁「A.0.17管道系统吹扫与清洗检查记录」掃描件，片段逐字：序号 |
    管线号 | 管道等级 | 工作介质 | 起点 | 终点 | 吹洗：压力Mpa 介质 流速M/s 鉴定 |
    化学清洗（脱脂）：介质 方法 鉴定；兩條管線各一列，吹洗介质「洁净水」、鉴定「合格」，
    化學清洗三欄均為「/」。
  form:
    title: 'A\.?0\.17管道系统吹扫与清洗检查记录'
    rowKey: 管线号
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    columns:
    - {name: 序号, label: 序号}
    - {name: 管线号, label: 管线号}
    - {name: 管道等级, label: 等级}
    - {name: 工作介质, label: 介质, occurrence: 1}
    - {name: 起点, label: 起点}
    - {name: 终点, label: 终点}
    - {name: 吹洗压力Mpa, label: 压力Mpa}
    - {name: 吹洗介质, label: 介质, occurrence: 2}
    - {name: 吹洗流速M/s, label: 流速M/s}
    - {name: 吹洗鉴定, label: 鉴定, occurrence: 1}
    - {name: 化学清洗介质, label: 介质, occurrence: 3}
    - {name: 化学清洗方法, label: 方法}
    - {name: 化学清洗鉴定, label: 鉴定, occurrence: 2}
  objectIdColumns: [管线号]
  # 2026-09-24 业务确认：交了吹扫与清洗检查记录即适用，逐项核对这张记录。
  applicableWhen: table_present
  fields:
  # 只取吹洗那一套。判據只有一個介質欄與一個結論欄；若在吹洗是「/」時改取化學清洗，
  # 兩欄可能各取自不同的方法，拼出一條表上不存在的記錄。化學清洗的記錄等真實樣本再補。
  - path: medium.name
    columns: [吹洗介质]
    parse: text
  - path: acceptance.conclusion
    columns: [吹洗鉴定]
    parse: text
  # 判据的检查项按吹洗介质分支；只看原文逐字写的介质（2026-09-24 业务确认），写的不是这几种就不出现。
  - path: medium.waterFlush
    columns: [吹洗介质]
    parse: keyword
    keywords: [水]
  - path: medium.airBlowing
    columns: [吹洗介质]
    parse: keyword
    keywords: [空气]
  - path: medium.steamBlowing
    columns: [吹洗介质]
    parse: keyword
    keywords: [蒸汽]
  # 化学清洗三栏写「/」＝本管线不做化学清洗。
  - path: medium.chemicalCleaning
    columns: [化学清洗介质]
    parse: filled

# 第 17 頁的壓力試驗和泄漏性試驗記錄是橫向表格直著掃描的（文字豎排），form_tables
# 會試兩個旋轉方向，只接受表頭順序對得上的那一個。同一張表供 R66、R67 兩條規則讀，
# 各自只取判據讀的欄；試驗用壓力表、介質／環境溫度、檢測方法、保壓時間、依據標準
# 表上都沒寫，一律不對映（設計溫度不是介質溫度）。
- businessSchema: leak_test_condition_domains
  domain: leakTestConditions
  objectType: pipeline
  sourceRuleIds: [R66]
  evidence: &leak_record_evidence >-
    七項目快照（2026-09-23）恒基達鑫交工資料 20260623104730.pdf 第 17 頁
    「A. 0.16管道系统压力试验和泄漏性试验记录」掃描件（逆時針 90° 豎排），片段逐字：
    序号 | 管线号 | 管道等级 | 设计参数：压力 温度 | 介质 | 起点 | 终点 |
    压力试验：介质 压力 结论 | 泄漏性试验：介质 压力 结论；兩條管線，泄漏性試驗
    介质「空气」、压力「0.55Mpa」、结论「合格」。
  form: &leak_record_form
    title: 'A\.?0\.16管道系统压力试验和泄漏性试验记录'
    rowKey: 管线号
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    columns:
    - {name: 序号, label: 序号}
    - {name: 管线号, label: 管线号}
    - {name: 管道等级, label: 等级}
    - {name: 设计压力, label: 压力, occurrence: 1}
    - {name: 设计温度, label: 温度}
    - {name: 工作介质, label: 介质, occurrence: 1}
    - {name: 起点, label: 起点}
    - {name: 终点, label: 终点}
    - {name: 压力试验压力, label: 压力, occurrence: 2}
    - {name: 压力试验介质, label: 介质, occurrence: 2}
    - {name: 压力试验结论, label: 结论, occurrence: 1}
    - {name: 泄漏性试验压力, label: 压力, occurrence: 3}
    - {name: 泄漏性试验介质, label: 介质, occurrence: 3}
    - {name: 泄漏性试验结论, label: 结论, occurrence: 2}
  objectIdColumns: [管线号]
  fields:
  - path: medium.name
    columns: [泄漏性试验介质]
    parse: text
  - path: pressure.testPressureMPa
    columns: [泄漏性试验压力]
    parse: number
    units: [MPa]
- businessSchema: leak_test_method_domains
  domain: leakTestMethod
  objectType: pipeline
  sourceRuleIds: [R67]
  evidence: *leak_record_evidence
  form: *leak_record_form
  objectIdColumns: [管线号]
  fields:
  - path: report.result
    columns: [泄漏性试验结论]
    parse: text

# 同一本交工資料的另兩張記錄表（2026-09-24 業務確認：交了記錄即適用，同 R68）。
- businessSchema: support_domains
  domain: supports
  objectType: pipe_support
  sourceRuleIds: [R55]
  evidence: >-
    七項目快照 GDLNG 交工資料 20260623104730.pdf 第 15 頁「表A.0.9管道支吊架的安装记录」
    掃描件，片段逐字：管线编号 管架编号 | 结构型式、型号、规格 | 坐标位移值偏差（mm）：允许值
    实测值 | 管道标高偏差（mm）：允许值 实测值 | 弹簧：调整值 | 备注；兩條管線各 5 列
    （PS-1、PS-2、PS-3~8、PS-9、PS-10）。
  form:
    title: 'A\.?0\.9管道支吊架的安装记录'
    rowKey: 管线编号
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    columns:
    - {name: 管线编号, label: 管线编号}
    - {name: 管架编号, label: 管架编号}
    - {name: 结构型式, label: 结构型式、型号、规格}
    - {name: 坐标允许值, label: 允许值, occurrence: 1}
    - {name: 坐标实测值, label: 实测值, occurrence: 1}
    - {name: 标高允许值, label: 允许值, occurrence: 2}
    - {name: 标高实测值, label: 实测值, occurrence: 2}
    - {name: 弹簧调整值, label: 调整值}
    - {name: 备注, label: 备注}
  # 每個支架一個對象（業務確認）：管線號＋管架編號，監檢員在候選清單裡選。
  objectIdJoin: [管线编号, 管架编号]
  applicableWhen: table_present
  fields:
  # 表上只寫結構型式；支架位置、檢查結論要從別的文件來，不對映（判「未抽取」交人工）。
  - path: support.type
    columns: [结构型式]
    parse: text
- businessSchema: installation_connection_domains
  domain: installationConnections
  objectType: pipeline
  sourceRuleIds: [R53]
  evidence: >-
    同一本交工資料第 14 頁「表A.0.6管道安装记录」掃描件（逆時針 90° 豎排），片段逐字：
    序号 | 管线编号 | 管道等级 | 管道规格 | 焊接连接：转动口数 固定口数 | 法兰连接：压力等级
    垫片材质 | 其他连接形式：机械接口 | 最大安全偏差（MIN）：坐标 标高 平直度 铅垂度 坡度；
    兩條管線 PL-8303-100、PL-8306-100，法兰压力等级 PN16、缠绕垫片。
  form:
    title: 'A\.?0\.6管道安装记录'
    rowKey: 管线编号
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    columns:
    - {name: 序号, label: 序号}
    - {name: 管线编号, label: 管线编号}
    - {name: 管道等级, label: 管道等级}
    - {name: 管道规格, label: 管道规格}
    - {name: 转动口数, label: 转动口数}
    - {name: 固定口数, label: 固定口数}
    - {name: 法兰压力等级, label: 压力等级}
    - {name: 垫片材质, label: 垫片材质}
    - {name: 机械接口, label: 机械接口}
    - {name: 坐标偏差, label: 坐标}
    - {name: 标高偏差, label: 标高}
    - {name: 平直度, label: 平直度}
    - {name: 铅垂度, label: 铅垂度}
    - {name: 坡度, label: 坡度}
  objectIdColumns: [管线编号]
  applicableWhen: table_present
  fields:
  # 法兰连接栏写了压力等级 = 有法兰接头：只用来决定法兰那几条判据适用（原文写明的值）。
  - path: installation.flangeJointPresent
    columns: [法兰压力等级]
    parse: filled

- businessSchema: coating_construction_domains
  domain: coatingConstruction
  objectType: pipeline
  sourceRuleIds: [R44]
  evidence: >-
    同一本交工資料第 19 頁「管道防腐施工及验收记录」掃描件（逆時針 90° 豎排），片段逐字：
    管线号 | 基层表面处理：处理方法 检查结果（等级） | 隔离层：名称 层数或厚度 检验结果 |
    防腐面层：名称 层数或厚度 检验结果 | 质量评定；兩條管線 PL8303-100、PL8306-100，
    喷砂除锈 St3.0级、环氧富锌底漆 二层/80μm、丙烯酸聚氨脂面漆 二层/80μm、合格。
  form:
    title: '管道防腐施工及验收记录'
    rowKey: 管线号
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    columns:
    - {name: 管线号, label: 管线号}
    - {name: 表面处理方法, label: 处理方法}
    - {name: 表面处理等级, label: 检查结果}
    - {name: 隔离层名称, label: 名称, occurrence: 1}
    - {name: 隔离层层数或厚度, label: 层数或厚度, occurrence: 1}
    - {name: 隔离层检验结果, label: 检验结果, occurrence: 1}
    - {name: 面层名称, label: 名称, occurrence: 2}
    - {name: 面层层数或厚度, label: 层数或厚度, occurrence: 2}
    - {name: 面层检验结果, label: 检验结果, occurrence: 2}
    - {name: 质量评定, label: 质量评定}
  objectIdColumns: [管线号]
  applicableWhen: table_present
  fields:
  # 判据的「涂层类型」取防腐面层的名称（表上逐字写的面漆）；记录编号表上没有，判「未抽取」。
  - path: coating.coatingType
    columns: [面层名称]
    parse: text

# 設計文件的「管道特性表」：MinerU 把整頁輸出成一段文字（表名、兩層表頭、每條管線一行），
# 由 libs/ocr/text_line_tables.py 按行重建，供 R14 管道特性與各節點的逐管線事實讀取。
# 只收表頭逐字吻合、格數完全對上的行；葉子欄名沿用 R14 抽取已有的別名。
- businessSchema: pipeline_characteristics
  evidence: >-
    七項目快照（2026-09-23）兩種真實版式：7F7270「设计说明书.pdf」第 3 頁（含气密、
    无损检测、材质，25 欄，兩條蒸汽管線 LS-04012-50-M1B、LS-0011）；6B15AE／OCR-002
    「6.2盈德华润设计图纸.pdf」第 6 頁（無气密、无损检测、材质，19 欄，一條氮氣管道 NG-01）。
    這兩種都沒有毒性程度、泄漏危害性、火灾危险性欄。第三種：ECD202／OCR-001「地上甲类储罐区2
    （含泵区）施工图.pdf」第 32 頁（23 欄，8 條管段 A01～A08-PL-02，介质特性「可燃」、泄漏试验要求「√」）。
  textLines:
    title: 管道特性表
    rowKeyPattern: '^[A-Z]{1,5}-?\d'
    variants:
    - id: with-airtightness
      header: 管线号 管道名称 管道规格(mm) 介质 改造起止点 设计参数 工作参数 内外防护 试压 气密 无损检测 清洗吹扫介质 管道长度(m) 管道类别 材质
      subHeader: 名称 状态 起点 止点 温度°C 压力Mpa 温度°C 压力Mpa 隔热材料 保温厚度(mm) 外防护 介质 压力Mpa 介质 压力Mpa 检测方式 检测比例 合格级别
      columns: [管线号, 管道名称, 规格, 介质, 介质状态, 起点, 终点, 设计温度, 设计压力, 工作温度, 工作压力,
                隔热材料, 保温厚度, 外防护, 试压介质, 试验压力MPa, 气密介质, 气密压力, 检测方式, 检测比例,
                合格级别, 清洗吹扫介质, 管道长度, 管道级别, 材质]
    # ECD202 施工图第 32 頁（HZ026Y-112-02-S301，2024 年起的廣東政和版式）：表名夾在圖簽行，
    # 「管道等级」是材料等級（M1E），「压力管道类别」才是管道級別（GC2）；介質「特性」寫可燃等，
    # 「泄漏试验要求」打 √。備註欄常空，按行文字會少一格，故宣告結尾可空 1 欄。
    - id: medium-property-and-leak-test
      header: 管段号 外径x壁厚(mm) 管道等级 压力管道类别 介质 工作参数 设计参数 绝热及防腐 试压要求 焊缝检测要求 泄漏试验要求 吹扫清洗介质 备注

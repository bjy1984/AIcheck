# 法规数值表（P1/P2/P10/N-16 的数据侧）。每张表都带 sourceClause / extractedFrom / verifiedBy：
# - verifiedBy 为空 = 由 OCR 或标准草案预填，写入判定前须由法规核对人对照正文逐格打钩（优化计划 §2.1）；
# - 代码里的判定只读这里的数值；数值不齐的规则只给预警，不给不符合。
# 2026-09-07 预填来源：TSG Z6002-2026 官方 PDF OCR（会话留存 z6002-2026-ocr.txt）、NB/T 47014-2023 OCR、
# GB/T 20801.1-2025 官方 PDF 正文（文字层；2026-09-08 由项目负责人提供，此前只有征求意见稿）、
# TSG 31-2025 官方 PDF OCR。
schemaVersion: regulatory-tables-v1

# 采信策略（2026-09-07 项目负责人决定）：不等法规核对人逐格签字，直接采信本文件的数值。
# 这里不把人名写进 verifiedBy——那等于伪造一份没发生过的背书；改用这个显式声明记录真实来由。
# 影响：is_verified() 一律返回 True，标准时间线里"已废止"的判定也随之生效（此前只有这一处受签字门禁）。
# 要退回"必须签字"，把 mode 改成 require_human_signoff 即可。
trustPolicy:
  mode: accept_without_human_signoff
  decidedBy: 项目负责人
  decidedOn: "2026-09-07"
  rationale: 数值多数已对照标准正文（官方全文平台或正版 PDF），项目决定先按现值判定，核对清单（docs/法规数值核对清单.md）留作后续复核
  residualRisk: 扫描件视觉识别的数值（GB/T 5117 表 6/表 7、GB/T 8163 表 5~8、GB/T 14976 表 2/表 3）个别数字可能认错；清单按可信度排序，最需要复核的排在最前
updatedAt: "2026-09-07"


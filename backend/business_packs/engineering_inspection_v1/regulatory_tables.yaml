nbt47014ThicknessCoverage:
  source: NB/T 47014-2023 表 6、表 7 对接焊缝试件厚度与焊件厚度规定；6.1.5 试件厚度与焊件厚度的评定规则
  extractedFrom: official_pdf_ocr_page_images
  sourceFile: 用户 2026-09-07 提供的 NB/T 47014-2023 PDF，第 41 页看图抄录
  verifiedBy: null
  note: T 为试件母材厚度，t 为试件每种焊接方法焊接的焊缝金属厚度；单位毫米。表 6 用于横向弯曲试验，表 7 用于纵向弯曲试验
  impactRule:
    clause: "6.1.5.2"
    text: 规定进行冲击试验时，焊条电弧焊/埋弧焊/钨极气体保护焊/熔化极气体保护焊/等离子弧焊/气电立焊评定合格后——T≥6mm 时母材厚度有效范围最小值取 T 与 16mm 的较小值；T<6mm 时最小值为 T/2
    exception: 试件经高于上转变温度的焊后热处理、奥氏体-铁素体双相钢接头、或奥氏体接头经固溶处理时，有冲击试验的评定用于无冲击要求的焊件仍按表 6 或表 7
  footnotes:
    a: 限于焊条电弧焊、埋弧焊、钨极气体保护焊、熔化极气体保护焊；其余按表 8、表 9 或 2T、2t
    b: 试件厚度大于 150mm 时应全厚度焊接
  transverseBend:
    table: 表 6
    rows:
      - {specimenT: "<1.5", baseMin: T, baseMax: 2T, weldMin: 不限, weldMax: 2t}
      - {specimenT: "1.5<=T<=10", baseMin: 1.5, baseMax: 2T, weldMin: 不限, weldMax: 2t}
      - {specimenT: "10<T<20", baseMin: 5, baseMax: 2T, weldMin: 不限, weldMax: 2t}
      - {specimenT: "20<=T<38", baseMin: 5, baseMax: 2T, weldMin: 不限, weldMax: "2t（t<20）/ 2T（t>=20）"}
      - {specimenT: "38<=T<=150", baseMin: 5, baseMax: "200（注a）", weldMin: 不限, weldMax: "2t（t<20）/ 200（注a，t>=20）"}
      - {specimenT: ">150（注b）", baseMin: 5, baseMax: "1.33T（注a）", weldMin: 不限, weldMax: "2t（t<20）/ 1.33T（注a，t>=20）"}
  longitudinalBend:
    table: 表 7
    rows:
      - {specimenT: "<1.5", baseMin: T, baseMax: 2T, weldMin: 不限, weldMax: 2t}
      - {specimenT: "1.5<=T<=10", baseMin: 1.5, baseMax: 2T, weldMin: 不限, weldMax: 2t}
      - {specimenT: ">10", baseMin: 5, baseMax: 2T, weldMin: 不限, weldMax: 2t}

nbt47014AnnexB:
  source: NB/T 47014-2023 附录 B（规范性）母材、填充金属和焊接方法的补充规定
  purpose: 表 1 查不到母材、表 2~表 4 查不到填充金属时，评定不是"无法判定"——附录 B 规定了替代路径与必须存档的报告
  extractedFrom: official_pdf_text_layer
  verifiedBy: null
  baseMaterial:
    clause: B.2
    inRangeButNotListed: 公称成分在表 1 所列母材范围内时，若"母材归类报告"表明承制单位已掌握该材料的化学成分、力学性能和焊接性，并确认与表 1 内某材料相当，可归入该类别、组别；否则应按每个材料代号分别评定
    outOfRange: 公称成分不在表 1 范围内时，承制单位应制订本单位的评定标准（技术要求不低于本文件），母材按"母材归类报告"分类分组
    reportContents:
      - 母材相应的标准或技术条件
      - 母材的冶炼方法、热处理状态、制品形态、技术要求
      - 产品质量证明书
      - 母材的焊接性（焊接性分析；工艺焊接性能、使用焊接性能）
      - 焊接方法、焊接材料和焊接工艺
      - 母材的使用业绩及其来源
      - 各项结论、数据及来源
      - 母材归类、归组陈述
      - 结论：该母材归入的类别、组别及其规定的标准抗拉强度最低值
    retention: 母材归类报告应存档备查（B.2.3）
  fillerMetal:
    clause: B.3
    categoryExistsButNotListedStandard: 表 2~表 4 中有相应类别但不是所列标准中的填充金属，若"填充金属归类报告"表明已掌握其化学成分、力学性能和焊接性，可按表 2~表 4 的分类依据分类；否则按各制造厂提供的型号或代号分别评定
    categoryNotListed: 表 2~表 4 尚未列出类别的填充金属，承制单位应制订本单位的评定标准，填充材料按"填充金属归类报告"分类
    reportContents:
      - 填充材料相应的标准或技术条件
      - 填充材料原始条件（制造厂型号或牌号；焊条药皮类型、电流类别及极性、焊接位置、熔敷金属化学成分和力学性能；埋弧焊焊丝-焊剂组合分类与熔敷金属 S、P 含量及力学性能；气焊/气保焊/等离子弧焊焊丝与填充丝的型号、化学成分、熔敷金属 S、P 含量及力学性能；产品质量证明书）
      - 填充材料的工艺性能
      - 填充材料的焊接性（焊接性分析；工艺焊接性能、使用焊接性能）
      - 填充材料的使用业绩及其来源
      - 各项结论、数据及来源
      - 填充金属归类陈述
      - 结论：该填充金属归入的类别
    retention: 填充金属归类报告应存档备查（B.3.3）
  weldingMethod:
    clause: B.4
    rule: 承压设备采用本文件规定范围以外的焊接方法时，应由承制单位遵照本文件相应规定，并参照近期 ASME 及国标等评定标准，编制该焊接方法的评定企业标准



gbt20801_inspection:
  source: GB/T 20801.5 压力管道规范 工业管道 第5部分 检验与试验——征求意见稿（201X）；正式版 2020 已于 2026-05-01 并入 GB/T 20801.1-2025
  verifiedBy: null
  caveat: 数值取自征求意见稿，与 2020 正式版及 2025 合并版可能不同；写入判定前必须对照 GB/T 20801.1-2025 正文
  inspectionLevels:
    sourceClause: "6.1 检查等级"
    rules:
      - level: Ⅰ
        conditions: [剧烈循环工况, 剧毒介质的 GC1, 高温工况（GB/T 20801.3 3.13）, 钛/镍/高铬镍钼奥氏体不锈钢管道, PN>160, 夹套管内管, 免除压力试验的管道, 设计要求 100% 无损检测]
      - level: Ⅱ
        conditions: [除剧毒外的 GC1, PN>50 的碳钢（要求冲击试验）, PN>110 的奥氏体不锈钢, 低温含镍钢/铬钼钢/双相不锈钢/铝, 设计要求 20% 无损检测]
      - level: Ⅲ
        conditions: [除 GC3 外 PN≤50 的碳钢（要求冲击试验）, 除 GC3 外 PN≤110 的奥氏体不锈钢, 设计要求 10% 无损检测]
      - level: Ⅳ
        conditions: [GC2, 除 GC3 外 PN≤50 的碳钢（无冲击试验要求）, 设计要求 5% 无损检测]
      - level: Ⅴ
        conditions: [GC3]
    gradeDefault:
      GC1: Ⅱ
      GC1_toxic: Ⅰ
      GC2: Ⅳ
      GC3: Ⅴ
  ratiosByLevel:
    sourceClause: 表 5-1 焊接接头检查方法和比例（%）
    columns: [对接环缝, 角焊缝, 支管连接]
    levels:
      Ⅰ: {visual: [100, 100, 100], surface: [100, 100, 100], volumetric: [100, null, 100]}
      Ⅱ: {visual: [100, 100, 100], surface: [20, 20, 20], volumetric: [20, null, 20]}
      Ⅲ: {visual: [100, 100, 100], surface: [10, null, 10], volumetric: [10, null, null]}
      Ⅳ: {visual: [100, 100, 100], volumetric: [5, null, null]}
      Ⅴ: {visual: [10, 100, 100]}
    notes: [注4 碳钢/不锈钢/铝合金无表面检测要求, 注5 支管体积检测适用于 ≥DN100]
  acceptance:
    sourceClause: "6.3.1.2"
    rules: [100% 射线 → JB/T 4730.2 Ⅱ级, 抽样/局部射线 → Ⅲ级, 100% 脉冲反射超声 → JB/T 4730.3 Ⅰ级, 抽样/局部超声 → Ⅱ级, TOFD → JB/T 4730.10 Ⅱ级]
  pressureTest:
    sourceClause: "9.1.3 液压试验 b)、9.1.4 气压试验 d)、9.2.1 常规泄漏试验"
    hydroTestRatio: 1.5
    hydroTemperatureCorrection: PT = 1.5·P·S1/S2
    pneumaticTestRatioMin: 1.1
    pneumaticNote: 征求意见稿为"不低于 1.1 倍设计压力"；GB 50235 口径 1.15 倍，两者待核取正式版
    leakTestPressure: 设计压力（真空管道 0.1MPa 内压）
    leakTestRequiredFor: [剧毒流体, 易燃易爆气体]
    reliefValveSetting: 不高于 1.1 倍试验压力


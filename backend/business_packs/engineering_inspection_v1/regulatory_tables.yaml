  - 焊条电弧焊
  - 埋弧焊
  - 熔化极气体保护焊
  - 钨极气体保护焊
  - 等离子弧焊
  - 气电立焊
  - 螺柱电弧焊
  - 摩擦焊
  - 电子束焊
  note: 每行 30 个标记 = 重要/补加/次要三组 × 10 种焊接方法，列序取自表头图。已用三处已知点校验：焊条电弧焊「改变电流种类或极性」为重要因素（2023 版由次要改来，见前言）、埋弧焊「改变混合焊剂的混合比例」为重要因素、气焊「改变可燃气体种类」为重要因素。带 * 号的因素本身就是冲击相关的补加因素。因素文字来自版面抽取，个别换行处可能缺字，判定只用编号与类别。

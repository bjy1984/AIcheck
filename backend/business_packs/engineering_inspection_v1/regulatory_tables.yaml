nbt47014SpecificFactors:
  source: NB/T 47014-2023 表 5 各种焊接方法的专用焊接工艺评定因素
  sourceClause: 5.2.2；分类定义见 5.2.1——重要因素影响拉伸与弯曲性能，补加因素影响冲击韧性，次要因素对力学性能无明显影响
  extractedFrom: official_pdf_text_layer_positional
  sourceFile: 用户 2026-09-07 提供的 NB/T 47014-2023 PDF，pdftotext -layout 抽取后按列位解析每行 30 个标记
  verifiedBy: null
  methodOrder:

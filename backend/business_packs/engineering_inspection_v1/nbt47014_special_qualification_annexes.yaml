  pages:
  - pdfPage: 69
    text: "NB/T 47014—2023 \n69 \n附  录  D \n（规范性） \n不锈钢-钢复合板焊接工艺评定 \nD.1  不锈钢-钢复合板（包括轧制复合法、爆炸焊接法和堆焊法生产的复合板）的焊接工艺评定除遵\n\
      守本文件中相关条款外，还应遵守本附录的规定。 \nD.2  覆层厚度参与设计强度计算 \nD.2.1  试件应以不锈钢-钢复合板制备。 \nD.2.2  母材厚度： \n经评定合格的焊接工艺适用于焊件母材厚度有效范围，应按试件的覆层和基层厚度分别计算。\
      \ \nD.2.3  焊缝金属厚度： \na） 先焊基层再焊覆层：焊接工艺评定试件应按图17 及7.3.2 中b）的规定测定化学成分，需\n符合有关技术文件的规定；测量加工表面至过渡层焊缝与基层焊材施焊焊缝金属交界面\n\
      的距离b，即为不锈钢耐蚀层焊缝金属评定最小厚度。经评定合格的焊接工艺适用于焊件\n焊缝金属厚度有效范围按组合焊缝金属厚度分别计算。 \nb） 先焊覆层再焊基层：焊接工艺评定试件不需进行焊缝金属化学成分分析，经评定合格的\n\
      焊接工艺适用于焊件焊缝金属厚度的有效范围按本文件正文执行。 \nD.2.4  拉伸和弯曲试验时，复合金属材料焊接接头各部位（包括基层、过渡焊缝和覆层）都应得\n到检验，冲击试验只检验基层的焊接接头。 \na） 拉伸试样应包括覆层和基层的全厚度；\
      \ \nb） 弯曲试验应包括覆层和基层的全厚度，应取4 个侧弯试样，弯曲试验参数按表12； \nc） 只对基层焊缝区（不含过渡层焊缝）及热影响区分别制取冲击试样。 \nD.2.5  力学性能及弯曲性能试验的合格指标：\
      \ \na） 拉伸试验：每个试样的抗拉强度Rm 应满足式（D.1）： \n \nm\nR ≥\nm1 1\nm2 2\n1\n2\nR T\nR T\nT\nT\n\n\n \n ····························\
      \ （D.1） \n式中： \nRm1 ——覆层材料规定的抗拉强度最低值，单位为兆帕（MPa）； \nRm2 ——基层材料规定的抗拉强度最低值，单位为兆帕（MPa）； \nT1 ——覆层材料厚度； \nT2 ——基层材料厚度。\
      \ \nb） 弯曲试验：合格指标按本文件正文规定；但对轧制复合法、爆炸焊接法和堆焊法生产的复合\n板的对接接头，侧弯试样复合界面未结合缺陷引起的分层、裂纹允许重新取样试验。 \nc） 冲击试验：合格指标按本文件正文中对钢质焊接接头的规定。\
      \ \n \n"
  - pdfPage: 70
    text: "NB/T 47014—2023 \n70 \nD.3  覆层厚度不参与设计强度计算 \n覆层厚度不参与复合板设计强度计算的焊接工艺评定可以按D.2 的规定。拉伸试验需除掉覆层，\n焊接接头抗拉强度应符合本文件正文的规定；经评定合格的焊接工艺适用于焊件基层焊缝金属（位\n\
      于复合板复合界面以下）厚度有效范围按组合焊缝金属厚度分别计算。也可以按下列规定进行评定。 \nD.3.1  基层按本文件正文规定进行焊接工艺评定，不必采用不锈钢-钢复合板制备试件。 \nD.3.2  先焊基层后焊覆层\
      \ \nD.3.2.1  基层焊缝金属应采用基层焊材和过渡层不锈钢焊材施焊，经评定合格的焊接工艺适用于\n焊件焊缝金属厚度有效范围，按组合焊缝金属厚度分别计算。 \nD.3.2.2  在基层母材上施焊连接覆层（板或堆焊金属）的焊缝时，则按本文件正文的规定进行耐\n\
      蚀堆焊工艺评定。 \nD.3.3  先焊覆层后焊基层按本文件正文的规定进行。 \n \n"

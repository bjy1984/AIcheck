  - pdfPage: 74
    text: "NB/T 47014—2023 \n74 \n附  录  F \n（规范性） \n螺柱电弧焊工艺评定 \nF.1  承受载荷的螺柱电弧焊工艺评定规则按本附录规定，但对于不承受载荷的螺柱，当采用自动化方\n\
      式焊接时，不要求进行焊接工艺评定。 \nF.2  评定规则 \nF.2.1  螺柱电弧焊工艺评定除遵守本文件规定外，还应遵守本附录的规定。 \nF.2.2  母材：当底板（管）母材类别号与螺柱材料类别号的组合改变后，要重新进行焊接工艺评定。\n\
      当螺柱材料的公称成分与表1 中某类别公称成分相同时，则该类别号即为此螺柱材料的类别号。 \nF.2.3  焊后热处理：改变焊后热处理类别，需重新进行焊接工艺评定。 \nF.2.4  焊接工艺评定因素按表5 的规定。\
      \ \nF.3  评定方法 \n用自动化方式（手工引弧除外）焊接10 个螺柱。当螺柱电弧焊不用于保温层时，且与螺柱相\n焊的底板母材不是Fe-1 类钢材时，则要焊接15 个螺柱，其中5 个螺柱供宏观检验。 \n\
      F.4  检验要求与结果评价 \nF.4.1  锤击试验或折弯试验：在螺柱电弧焊试件上间隔取5 个螺柱电弧焊接头作试验件。 \na） 锤击螺柱上部，使螺柱上部至少1/4 长度贴合到试件底板母材上，然后再使它恢复原状；\
      \ \nb） 用图F.1 所示套管，将已焊好的螺柱弯曲与原位置至少成15°夹角，然后再使它恢复原状； \nc） 5 个螺柱焊接头中的每一个试验件的焊缝和热影响区都无肉眼可见的开裂为合格。 \nF.4.2  将按F.4.1\
      \ 间隔取样后剩余的5 个螺柱焊接头作试验件。 \na） 当螺柱上有螺纹时，进行扭转试验，扭转试验装置如图F.2 所示。试验时，螺母与螺柱尺\n寸相配合。螺柱上的螺纹，除残存切削油外应无其他润滑剂。 \n \n\
      \ \n \n \n \n \n \n"

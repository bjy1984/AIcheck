  pages:
  - pdfPage: 67
    text: "NB/T 47014—2023 \n67 \n附  录  C \n（规范性） \n带堆焊隔离层的对接焊缝焊接工艺评定 \nC.1  带堆焊隔离层的焊缝按本附录的规定。 \nC.2  带隔离层焊接接头示意图，如图C.1\
      \ 所示。δc 为隔离层的厚度。 \n \n注：第一焊件采用试件一，第二焊件采用试件二。 \n图C.1  带隔离层焊接接头示意图 \n \nC.3  属以下的情况，需堆焊隔离层： \na） 堆焊隔离层的焊件需经热处理，而后续焊缝不热处理或热处理温度不同；\
      \ \nb） 堆焊隔离层用填充金属与后续焊缝用填充金属类别号不同。 \nC.4  隔离层和后续焊缝的所有因素按本文件正文中相对应的焊接方法规定。 \nC.5  试件制备 \na） 先在试件一坡口上堆焊隔离层，如第一焊件需焊后热处理，则试件一堆焊隔离层后也需\n\
      相应的焊后热处理，再焊接后续焊缝；如第二焊件需焊后热处理，则对整个试件进行相应\n的焊后热处理。 \nb） 除a）外，如隔离层堆焊所用填充金属与后续焊缝所用填充金属公称成分相同，则可按两\n类（组）别号母材直接对接。\
      \ \nC.6  检验要求和结果评价 \n焊接接头力学性能和弯曲性能检验要求和结果评价同本文件正文，但隔离层焊缝与后续焊缝应\n分别取样进行冲击试验（但采用奥氏体不锈钢或镍基焊材堆焊隔离层除外）。 \nC.7 \
      \ 隔离层堆焊评定厚度 \n隔离层厚度指堆焊面机加工或打磨后所保留的厚度。如试件上隔离层堆焊厚度小于5 mm，需\n测量并记录δc 具体值，该值为隔离层堆焊评定最小厚度。 \n"
  - pdfPage: 68
    text: "NB/T 47014—2023 \n68 \nC.8  重新评定 \n当隔离层堆焊后，后续焊缝一个重要因数改变或由另外一个单位完成时，需重新进行焊接工艺\n评定。 \na） 当原焊接工艺评定试件隔离层评定厚度<5\
      \ mm 时，按C.5 重新制备焊接工艺评定试件，但\n新的焊接工艺评定试件堆焊隔离层厚度及焊接热输入不允许超过原焊接工艺评定报告上\n的数值； \nb） 当原焊接工艺评定试件隔离层厚度≥5 mm 时，后续焊缝的焊接工艺评定试件可按另一侧\n\
      母材确定。 \n"

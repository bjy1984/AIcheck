  pages:
  - pdfPage: 71
    text: "NB/T 47014—2023 \n71 \n附  录  E \n（规范性） \n换热管与管板焊接工艺评定 \nE.1  本附录规定了换热管与管板的焊接工艺评定方法。 \nE.2  当相应标准或设计文件没有规定试件类别时，换热管与管板的焊接工艺评定试件采用下列类别\n\
      任意一种；当相应标准或设计文件规定采用模拟组件进行焊接工艺评定时，不得变更。 \na） 角焊缝试件； \nb） 对接焊缝试件； \nc） 模拟组件。 \nE.3  角焊缝试件与对接焊缝试件按本文件正文中的规定进行焊接工艺评定。\
      \ \nE.4  模拟组件按本附录规定的方法进行焊接工艺评定。 \nE.5  模拟组件评定规则、评定方法、检验方法和结果评价按本条款。 \nE.5.1  评定规则 \nE.5.1.1  当发生下列情况时，需重新进行模拟组件焊接工艺评定：\
      \ \na） 改变焊接方法及机动化程度（手工、半机动、机动、自动）； \nb） 改变母材类别号及填充金属类别号； \nc） 小于设计要求的l 值； \nd） 焊接接头结构的改变（制造公差除外），如坡口深度增加超过10%，或焊缝坡口制备角度\n\
      改变超过5°，或改变坡口类型； \ne） 增加或取消焊后热处理； \nf） 改变焊前清理或层间清理方法（打磨等）； \ng） 改变电流种类或极性； \nh） 预热温度比已评定合格值降低55 ℃以上或道间温度比评定记录值高55\
      \ ℃以上； \ni） 增加填充金属公称直径； \nj） 焊前增加管子胀接； \nk） 由单道焊改为多道焊，或反之； \nl） 评定合格的电流值改变超过10%； \nm） 手工焊时由向上立焊改变为向下立焊，或反之（盖面焊道除外）；\
      \  \nn） 变更管子与管板接头焊接位置； \no） 增加或取消预置填充金属； \np） 增加或取消根部自熔焊。 \nE.5.1.2  当试件中换热管公称壁厚b≤2.5 mm 时，评定合格的焊接工艺适用于焊件中换热管公称壁\n\
      厚不得超过0.5b～2b；当试件中换热管公称壁厚b＞2.5 mm 时，评定合格的焊接工艺适用于焊件公\n"
  - pdfPage: 72
    text: "NB/T 47014—2023 \n72 \n称壁厚大于2.5 mm 所有换热管的焊接。 \nE.5.1.3  当焊件孔桥宽度Bn＜10 mm，或焊件孔桥宽度Bn≥10 mm 但小于3 倍产品管壁厚时，评\n\
      定试件的孔桥宽度B≤1.1Bn。 \nE.5.2  堆焊管板 \n管板上采用非合金钢、细晶粒钢焊材堆焊的焊缝金属，需有经评定合格的对接焊缝PQR 支撑，\n管板试件可采用与堆焊焊缝金属力学性能相当的母材；管板上堆焊耐蚀合金的焊缝金属，需有经评\n\
      定合格的耐蚀堆焊PQR 支撑，管板试件可采用与堆焊焊缝金属公称化学成分相当的母材。 \nE.5.3  评定方法 \nE.5.3.1  试件接头的结构与形式在焊接前后与焊件基本相同，至少焊接10 个模拟焊缝。 \n\
      E.5.3.2  试件的尺寸 \na） 管板厚度应不小于最薄的产品管板厚度，可不超过50 mm。当使用复合金属材料时，管板\n可采用与覆层同类别的材料。 \nb） 试板孔直径和允许偏差、管板孔中心距K 以及试板孔的坡口尺寸按照设计文件的规定。\
      \ \nc） 试件用换热管长度不小于80 mm。 \nd） 换热管插入管板，换热管伸出长度、平齐或内缩长度按设计文件的规定。 \ne） 试件管孔布置按图E.1 和图E.2。 \n \n \n图E.1  三角形排列的试件示例图\
      \ \n \n \n \n \n \n"
  - pdfPage: 73
    text: "NB/T 47014—2023 \n73 \n \n图E.2  正方形排列的试件示例图 \nE.5.4  检验要求与结果评定 \nE.5.4.1  检验项目：外观检验、渗透检验、金相检验（宏观）和焊脚高度l\
      \ 测定。 \nE.5.4.2  外观检验：表面应无裂纹、气孔、管内壁熔化、管端头烧穿（仅角焊缝）；外径小于或等于\n25 mm 的管子，焊瘤不应大于0.5 mm；外径大于25 mm 的管子，焊瘤不应大于1 mm；咬边深度不得\n\
      超过0.1b。 \nE.5.4.3  渗透检验：焊接接头全按NB/T 47013.3 进行渗透检测，无裂纹为合格。 \nE.5.4.4  金相检验（宏观）：按图E.3 所示，任取呈对角线位置的2 个管接头切开，两切口互相\n\
      垂直。切口一侧面应通过换热管中心线，该侧面即为金相检验面，共有8 个，其中应包括1 个取自\n接弧处，焊缝根部应焊透，不允许有裂纹、未熔合。 \nE.5.4.5  焊脚高度l 测定：在8 个金相检验面上测定。每个焊脚高度l\
      \ 都应大于或等于设计文件的\n规定，且不小于换热管公称壁厚b。 \n \n注： \n1.切口宽度小于2 mm； \n2.切断前将管板加工到大于或等于13 mm 亦可。 \n图E.3  试样制取及检验示例图 \n\
      \ \n"

    text: "NB/T 47014—2023 \n76 \n \n图F.2  螺柱电弧焊扭转试验装置 \n \nb） 当螺柱无螺纹时，则采用拉伸试验，拉伸试验装置如图F.3 所示。如果不是图F.3 中所示\n的螺栓，而是螺柱，可用拉伸试验机的钳口夹紧螺柱上部，进行拉伸试验。\
      \ \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n图F.3  螺柱电弧焊拉伸试验推荐装置 \n \nc） 合格指标： \n1） 扭转试验的每一个螺柱电弧焊接头破坏前的扭矩不应低于表F.1\
      \ 或表F.2 所列的数值。 \n2） 拉伸试验的碳钢螺柱断裂强度不应低于240 MPa；奥氏体不锈钢螺柱断裂强度不应低于\n210 MPa；其他材料断裂强度不应低于螺柱材料规定最小抗拉强度的一半。断裂强度的\n\
      计算，除柱体直径小于螺纹内径外，应根据外车制螺纹螺柱的螺纹内直径，或者根据\n非车制螺纹、内车制螺纹或变缩直径螺柱发生断裂处的原始截面积进行计算。 \n"

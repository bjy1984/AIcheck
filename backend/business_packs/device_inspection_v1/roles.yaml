roles:
  - code: device_reviewer
    label: 年检审核员
    platformRole: reviewer
    defaultPath: /workbench/inspection
    defaultNodeId: 3
    actions: [project:view, file:view, file:preview, file:download, review:save, review:return-correction, ai:recheck, ai:adopt, ai:reject, report:generate, report:review, report:export, report:view, archive:view, todo:update, message:update]
  - code: device_submitter
    label: 设备管理单位
    platformRole: submitter
    defaultPath: /workbench/contractor
    defaultNodeId: 1
    actions: [project:view, file:view, file:upload, file:bind, file:preview, file:download, file:withdraw, submission:draft, submission:submit, submission:withdraw, rectification:submit, todo:update, message:update]
  - code: device_observer
    label: 管理观察者
    platformRole: observer
    defaultPath: /workbench/owner
    defaultNodeId: 3
    actions: [project:view, file:view, file:preview, report:view, archive:view, archive:download]
  - code: admin
    label: 系统管理员
    platformRole: admin
    defaultPath: /admin/overview
    defaultNodeId: 1
    actions: [project:view, project:authorize-member, knowledge:view, knowledge:manage, llm:compare, admin:config, admin:export, audit:view, todo:update, message:update]

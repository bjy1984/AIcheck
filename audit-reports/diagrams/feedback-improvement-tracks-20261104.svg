<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1200" viewBox="0 0 680 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="680" height="600" fill="#FFFFFF"/><rect x="100" y="40" width="140" height="44" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/><text x="170.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">院 A 的反馈</text><rect x="270" y="40" width="140" height="44" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">院 B 的反馈</text><rect x="440" y="40" width="140" height="44" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/><text x="510.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">院 C 的反馈</text><line x1="170" y1="84" x2="170" y2="122" stroke="#888780" stroke-width="1.2"/><polygon points="166,116 174,116 170,122" fill="#888780"/><line x1="340" y1="84" x2="340" y2="122" stroke="#888780" stroke-width="1.2"/><polygon points="336,116 344,116 340,122" fill="#888780"/><line x1="510" y1="84" x2="510" y2="122" stroke="#888780" stroke-width="1.2"/><polygon points="506,116 514,116 510,122" fill="#888780"/><rect x="100" y="124" width="480" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">这个改动给所有院，会有院变差吗？</text><text x="340.0" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">定性：公共改进 / 灰区开关 / 院级配置</text><line x1="125" y1="180" x2="125" y2="218" stroke="#888780" stroke-width="1.2"/><polygon points="121,212 129,212 125,218" fill="#888780"/><line x1="340" y1="180" x2="340" y2="218" stroke="#888780" stroke-width="1.2"/><polygon points="336,212 344,212 340,218" fill="#888780"/><line x1="555" y1="180" x2="555" y2="218" stroke="#888780" stroke-width="1.2"/><polygon points="551,212 559,212 555,218" fill="#888780"/><rect x="40" y="220" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="125.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">不会 → 公共改进</text><text x="125.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">改平台代码和规则</text><rect x="255" y="220" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">说不清 → 灰区开关</text><text x="340.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">平台给预设，各院可改</text><rect x="470" y="220" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="555.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">会 → 院级配置</text><text x="555.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">院里自己改，只能更严</text><line x1="125" y1="276" x2="125" y2="304" stroke="#888780" stroke-width="1.2"/><polygon points="121,298 129,298 125,304" fill="#888780"/><line x1="340" y1="276" x2="340" y2="304" stroke="#888780" stroke-width="1.2"/><polygon points="336,298 344,298 340,304" fill="#888780"/><line x1="555" y1="276" x2="555" y2="304" stroke="#888780" stroke-width="1.2"/><polygon points="551,298 559,298 555,304" fill="#888780"/><rect x="40" y="306" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="125.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">所有院一起受益</text><text x="125.0" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">老项目要「规则升级」</text><rect x="255" y="306" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">审查按本院口径判</text><text x="340.0" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">结果里写明用了哪种</text><rect x="470" y="306" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 3"/><text x="555.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">资料加项、地方标准</text><text x="555.0" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">方案里有，还没做</text><line x1="340" y1="362" x2="340" y2="398" stroke="#888780" stroke-width="1.2"/><polygon points="336,392 344,392 340,398" fill="#888780"/><line x1="555" y1="362" x2="555" y2="398" stroke="#888780" stroke-width="1.2"/><polygon points="551,392 559,392 555,398" fill="#888780"/><rect x="40" y="400" width="600" height="120" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/><text x="60" y="422" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">越用越顺：多数院的选择变成默认</text><rect x="60" y="444" width="160" height="56" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/><text x="140.0" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">各院的选择汇总</text><text x="140.0" y="482" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">平台管理员看得到</text><line x1="220" y1="472" x2="258" y2="472" stroke="#888780" stroke-width="1.2"/><polygon points="252,468 252,476 258,472" fill="#888780"/><rect x="260" y="444" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">多数院选同一种</text><text x="340.0" y="482" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">平台管理员改预设</text><line x1="420" y1="472" x2="458" y2="472" stroke="#888780" stroke-width="1.2"/><polygon points="452,468 452,476 458,472" fill="#888780"/><rect x="460" y="444" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="540.0" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">跟随默认的院用上</text><text x="540.0" y="482" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">不用各自再改</text><text x="40" y="552" font-size="12" fill="#5F5E5A">紫色：平台，所有院共用　青色：各院自己的设定　虚线框：方案里有、还没做</text><text x="40" y="574" font-size="12" fill="#5F5E5A">每条改进上线后由提交人确认；仍有问题就重新打开，再走一轮</text></svg>
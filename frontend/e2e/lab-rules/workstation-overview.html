<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICheck 工作台可交互原型</title><style>body{margin:0;background:var(--el-bg-color-page);font-family:system-ui;color:var(--el-text-color-primary)}button,select{min-height:44px}button:focus-visible,select:focus-visible{outline:2px solid var(--el-color-primary)}.prototype-layout{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:20px;padding:20px}.prototype-layout>*{min-width:0}.prototype-heading{padding:20px;background:var(--el-bg-color)}.prototype-controls{display:flex;gap:8px;flex-wrap:wrap}.prototype-layout aside{padding:16px;background:var(--el-bg-color);border-radius:10px}.prototype-layout select{width:100%}.prototype-layout button{cursor:pointer}.prototype-layout nav{display:flex;flex-direction:column;gap:8px;margin:16px 0}@media(max-width:1100px){.prototype-layout{grid-template-columns:180px minmax(0,1fr)}.prototype-context{grid-column:1/-1}}@media(max-width:767px){.prototype-layout{grid-template-columns:minmax(0,1fr);padding:12px}.prototype-layout aside:first-child{padding:12px}}.prototype-node-menu summary{min-height:44px;padding:10px 0;box-sizing:border-box;cursor:pointer}button:not(.el-button){border:1px solid var(--el-border-color);background:var(--el-bg-color);color:var(--el-text-color-primary);border-radius:6px;padding:8px 12px}@media(min-width:768px){.prototype-node-menu>summary{display:none}}</style></head><body><div id="app"></div><script type="module" src="./workstation-overview.ts"></script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>监检辅助审查报告</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#203047;background:#f3f6fa;line-height:1.7}body{margin:0}header{background:#153861;color:white;padding:30px max(20px,calc((100vw - 1160px)/2))}h1{font-size:26px;margin:0}header p{color:#d3e2f3}main{max-width:1160px;margin:20px auto;padding:0 18px}nav{position:sticky;top:0;background:#fff;padding:12px 18px;border-bottom:1px solid #dae2ec;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}nav a{font-size:14px}select,button{font:inherit;background:white;border:1px solid #b7c7da;border-radius:6px;padding:5px 10px;color:#203047}section,details{background:white;border:1px solid #dce5f0;border-radius:10px;padding:18px 22px;margin:14px 0}h2{font-size:19px;margin:0 0 12px}p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:600;line-height:1.8}summary .badge{float:right;font-weight:500;font-size:13px;padding:1px 10px;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e1e7ef;text-align:left;padding:10px;vertical-align:top;min-width:65px;overflow-wrap:anywhere}th{background:#eef4fb}td{max-width:430px}.table-wrap{overflow-x:auto}a{color:#145dc0;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ffb020}section,details,tr{scroll-margin-top:130px}.passed{background:#e0f3e9;color:#156c43}.failed{background:#ffe3e1;color:#a1251c}.warning{background:#fff1d5;color:#895400}.manual,.insufficient,.pending{background:#edf0f5;color:#485b74}#summary{border-left:5px solid #286bc1}#materials{font-size:12px}.filter-note{font-size:13px;color:#65748b}[hidden]{display:none!important}footer{padding:25px;text-align:center;color:#66758b;font-size:13px}@media(max-width:650px){section,details,tr{scroll-margin-top:210px}main{padding:0 10px}section,details{padding:14px}summary .badge{float:none;display:inline-block}h1{font-size:22px}}@media print{nav{display:none}body{background:white}header{color:#203047;background:white;padding:10px}header p{color:#485b74}main{max-width:none;margin:0;padding:0}section,details{break-inside:auto;border-radius:0;padding:10px;margin:6px 0}.table-wrap{overflow:visible}td{max-width:unset}a{color:inherit}h2,summary{break-after:avoid}tr{break-inside:avoid}footer{font-size:10px}}
</style></head><body><header><h1>监检辅助审查报告</h1><p>先处理问题，再核对证据。所有结果为辅助意见。</p></header>
<nav aria-label="报告导航"><a href="#summary">摘要</a><a href="#nodes">节点总览</a><a href="#actions">处理清单</a><a href="#materials">证据附录</a><label>节点 <select id="node"><option value="all">全部</option><!--OPTIONS--></select></label><label>结果 <select id="result"><option value="all">全部</option><option value="issues">待处理</option><option value="passed">符合</option></select></label><button id="expand">展开全部</button><button id="collapse">收起全部</button><button id="print">打印／存为 PDF</button><span class="filter-note">筛选仅影响核查详情</span></nav>
<main><!--BODY--></main><footer>本地生成，无远程资源。校验通过不等于工程合格；正式结论由监检人员确认。</footer>
<script>
const checks=[...document.querySelectorAll('details.check')],allDetails=[...document.querySelectorAll('details')],groups=[...document.querySelectorAll('.node-group')];
const node=document.getElementById('node'),result=document.getElementById('result');
function filter(){groups.forEach(e=>e.hidden=node.value!=='all'&&e.dataset.node!==node.value);checks.forEach(e=>e.hidden=!(node.value==='all'||e.dataset.node===node.value)||!(result.value==='all'||(result.value==='issues'?!['passed','not_applicable'].includes(e.dataset.result):e.dataset.result===result.value)))}
node.addEventListener('change',filter);result.addEventListener('change',filter);
document.getElementById('expand').onclick=()=>allDetails.forEach(e=>e.open=true);
document.getElementById('collapse').onclick=()=>allDetails.forEach(e=>e.open=false);
let printState=[];window.addEventListener('beforeprint',()=>{printState=allDetails.map(e=>[e.open,e.hidden]);allDetails.forEach(e=>{e.open=true;e.hidden=false})});window.addEventListener('afterprint',()=>allDetails.forEach((e,i)=>{if(printState[i])[e.open,e.hidden]=printState[i]}));
document.getElementById('print').onclick=()=>window.print();
window.addEventListener('hashchange',()=>{const e=document.getElementById(location.hash.slice(1));if(e){e.hidden=false;if(e.tagName==='DETAILS')e.open=true;let parent=e.parentElement;while(parent){if(parent.tagName==='DETAILS'){parent.hidden=false;parent.open=true}parent=parent.parentElement}e.scrollIntoView()}});
</script></body></html>

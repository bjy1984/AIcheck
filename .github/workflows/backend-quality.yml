name: Backend quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "test2/**"
      - "docs/工程监检资料映射表.md"
      - "rules/**"
      - "业务规则.md"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - "test2/**"
      - "docs/工程监检资料映射表.md"
      - "rules/**"
      - "业务规则.md"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff ratchet (no new lint findings)
        run: python -m pip install ruff==0.16.2 && python -m scripts.ruff_baseline

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aicheck_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AICHECK_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/aicheck_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.txt

      - name: Install test shell
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install backend and test dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.txt

      - name: Verify immutable migration manifest
        run: python scripts/migrate_backend.py --verify-only

      - name: Collect backend tests
        run: pytest --collect-only -q

      - name: Run backend suite with real PostgreSQL
        run: pytest -q

      # MinIO 官方镜像先后收回：Docker Hub 2026-09-24 起 pull access denied，
      # quay.io/minio/minio 2026-09-25 起也要登录（仓库 API 401）。改用 Bitnami 冻结的
      # legacy 仓库里的同一版本（MinIO 2025-04-22），按 digest 固定。
      # 用镜像自带的启动命令：它读 MINIO_ROOT_USER/PASSWORD、在 9000 端口起服务，
      # 数据目录是非 root 用户可写的 /bitnami/minio/data。
      - name: Start isolated MinIO with object lock support
        run: >-
          docker run -d --name aicheck-test-minio
          -p 9000:9000
          -e MINIO_ROOT_USER=aicheck-ci
          -e MINIO_ROOT_PASSWORD=AicheckCiMinioSecret-2026
          docker.io/bitnamilegacy/minio:2025.4.22@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01

      - name: Wait for MinIO readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs aicheck-test-minio
          exit 1

      - name: Verify live immutable audit anchoring
        env:
          AICHECK_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          AICHECK_TEST_MINIO_ACCESS_KEY: aicheck-ci
          AICHECK_TEST_MINIO_SECRET_KEY: AicheckCiMinioSecret-2026
          AICHECK_TEST_MINIO_BUCKET_PREFIX: aicheck-ci-${{ github.run_id }}
        run: pytest -q tests/test_audit_anchor_minio_integration.py

      - name: Restart MinIO service
        run: |
          docker restart aicheck-test-minio
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs aicheck-test-minio
          exit 1

      - name: Verify retained audit version after MinIO restart
        env:
          AICHECK_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          AICHECK_TEST_MINIO_ACCESS_KEY: aicheck-ci
          AICHECK_TEST_MINIO_SECRET_KEY: AicheckCiMinioSecret-2026
          AICHECK_TEST_MINIO_BUCKET_PREFIX: aicheck-ci-${{ github.run_id }}
          AICHECK_TEST_MINIO_EXPECT_EXISTING_ANCHOR: "true"
        run: pytest -q tests/test_audit_anchor_minio_integration.py

      - name: Verify Temporal retry and persistent server-restart recovery
        env:
          AICHECK_TEST_TEMPORAL_LIVE: "true"
        run: pytest -q tests/test_temporal_live_integration.py
